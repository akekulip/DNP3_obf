<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 930 224' preserveAspectRatio='xMidYMid meet'><style>text{fill:#14202c}.t{font-family='Helvetica,Arial,sans-serif';font-size:13px} .h{font-family='Helvetica,Arial,sans-serif';font-size:15px;font-weight:bold}.s{font-family='Helvetica,Arial,sans-serif';font-size:11px;fill:#5a6b7a} .m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}.box{fill:#f2f5f9;stroke:#2f4a63;stroke-width:1.5}.sw{fill:#e7effa;stroke:#1e5f9e;stroke-width:2}.hold{fill:#fdf1e0;stroke:#b87514;stroke-width:1.6}.norm{fill:#e6f4f1;stroke:#1f7a6b;stroke-width:1.6}.bad{fill:#fbeaee;stroke:#a8324a;stroke-width:1.6}.ln{stroke:#2f4a63;stroke-width:1.6;fill:none}.dsh{stroke:#8496a6;stroke-width:1.2;stroke-dasharray:5 4;fill:none}@media(prefers-color-scheme:dark){text{fill:#e4eaf1}.s{fill:#8b9aaa}.box{fill:#1b232c;stroke:#7fa3c4}.sw{fill:#16283a;stroke:#5aa6e8}.hold{fill:#33260f;stroke:#e0a448}.norm{fill:#12302b;stroke:#4fbfa9}.bad{fill:#331a20;stroke:#e0697f}.ln{stroke:#9ab}.dsh{stroke:#7c8a99}}</style><defs><marker id='a' markerWidth='10' markerHeight='10' refX='9' refY='3' orient='auto'><path d='M0,0 L9,3 L0,6 Z' fill='#2f4a63'/></marker><marker id='ah' markerWidth='10' markerHeight='10' refX='9' refY='3' orient='auto'><path d='M0,0 L9,3 L0,6 Z' fill='#b87514'/></marker></defs><text x='430' y='24' class='h' text-anchor='middle'>Inline bump-in-the-wire: every DNP3 packet transits the ASIC</text><rect x='20' y='60' width='150' height='76' rx='4' class='box'/><text x='95' y='86' class='t' text-anchor='middle'>MASTER (Vision)</text><text x='95' y='104' class='m' text-anchor='middle'>192.168.10.1</text><text x='95' y='122' class='s' text-anchor='middle'>enp59s0f0np0</text><rect x='250' y='48' width='260' height='130' rx='4' class='sw'/><text x='380' y='72' class='h' text-anchor='middle'>TOFINO-1</text><text x='380' y='90' class='m' text-anchor='middle'>dnp3_timing_normalizer_inline</text><rect x='268' y='104' width='106' height='58' rx='4' class='hold'/><text x='321' y='124' class='s' text-anchor='middle'>dp8 loopback</text><text x='321' y='140' class='m' text-anchor='middle'>Q_BLOCK  pri 7</text><text x='321' y='156' class='m' text-anchor='middle'>Q_RESP   pri 0</text><text x='452' y='124' class='m' text-anchor='middle'>dp9</text><text x='452' y='140' class='s' text-anchor='middle'>dev_port</text><text x='452' y='156' class='m' text-anchor='middle'>64</text><rect x='586' y='60' width='118' height='76' rx='4' class='box'/><text x='645' y='86' class='t' text-anchor='middle'>unmanaged</text><text x='645' y='104' class='t' text-anchor='middle'>switch</text><text x='645' y='122' class='s' text-anchor='middle'>p1 + p25 only</text><rect x='776' y='60' width='134' height='76' rx='4' class='box'/><text x='843' y='86' class='t' text-anchor='middle'>SEL-751</text><text x='843' y='104' class='m' text-anchor='middle'>192.168.10.7</text><text x='843' y='122' class='s' text-anchor='middle'>100M RJ45</text><path d='M170,98 L248,98' class='ln' marker-end='url(#a)'/><text x='209' y='90' class='s' text-anchor='middle'>25G</text><path d='M510,98 L584,98' class='ln' marker-end='url(#a)'/><text x='547' y='90' class='s' text-anchor='middle'>1G SFP</text><path d='M704,98 L774,98' class='ln' marker-end='url(#a)'/><text x='739' y='90' class='s' text-anchor='middle'>100M</text><text x='430' y='206' class='s' text-anchor='middle'>The relay has exactly ONE route to the master. Proof: with dev_port 64 disabled, ping is 0/3 (100% loss).</text></svg>