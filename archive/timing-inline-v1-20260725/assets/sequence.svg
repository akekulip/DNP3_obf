<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 314' preserveAspectRatio='xMidYMid meet'><style>text{fill:#14202c}.t{font-family='Helvetica,Arial,sans-serif';font-size:13px} .h{font-family='Helvetica,Arial,sans-serif';font-size:15px;font-weight:bold}.s{font-family='Helvetica,Arial,sans-serif';font-size:11px;fill:#5a6b7a} .m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}.box{fill:#f2f5f9;stroke:#2f4a63;stroke-width:1.5}.sw{fill:#e7effa;stroke:#1e5f9e;stroke-width:2}.hold{fill:#fdf1e0;stroke:#b87514;stroke-width:1.6}.norm{fill:#e6f4f1;stroke:#1f7a6b;stroke-width:1.6}.bad{fill:#fbeaee;stroke:#a8324a;stroke-width:1.6}.ln{stroke:#2f4a63;stroke-width:1.6;fill:none}.dsh{stroke:#8496a6;stroke-width:1.2;stroke-dasharray:5 4;fill:none}@media(prefers-color-scheme:dark){text{fill:#e4eaf1}.s{fill:#8b9aaa}.box{fill:#1b232c;stroke:#7fa3c4}.sw{fill:#16283a;stroke:#5aa6e8}.hold{fill:#33260f;stroke:#e0a448}.norm{fill:#12302b;stroke:#4fbfa9}.bad{fill:#331a20;stroke:#e0697f}.ln{stroke:#9ab}.dsh{stroke:#7c8a99}}</style><defs><marker id='a' markerWidth='10' markerHeight='10' refX='9' refY='3' orient='auto'><path d='M0,0 L9,3 L0,6 Z' fill='#2f4a63'/></marker><marker id='ah' markerWidth='10' markerHeight='10' refX='9' refY='3' orient='auto'><path d='M0,0 L9,3 L0,6 Z' fill='#b87514'/></marker></defs><text x='470' y='22' class='h' text-anchor='middle'>One transaction: native (left) versus protected (right)</text><text x='230' y='46' class='t' text-anchor='middle'>NATIVE: nothing holds the response</text><text x='60' y='66' class='s' text-anchor='middle'>master</text><path d='M60,74 L60,300' class='dsh'/><text x='230' y='66' class='s' text-anchor='middle'>TOFINO</text><path d='M230,74 L230,300' class='dsh'/><text x='400' y='66' class='s' text-anchor='middle'>relay</text><path d='M400,74 L400,300' class='dsh'/><path d='M60,96 L396,96' class='ln' marker-end='url(#a)'/><text x='230' y='90' class='s' text-anchor='middle'>Class-0 READ</text><path d='M400,130 L64,130' class='ln' marker-end='url(#a)'/><text x='230' y='124' class='s' text-anchor='middle'>pure TCP ACK</text><circle cx='230' cy='130' r='4' class='norm'/><path d='M400,172 L64,172' class='ln' marker-end='url(#a)'/><text x='230' y='166' class='s' text-anchor='middle'>DNP3 response</text><path d='M46,130 L46,172' class='ln'/><text x='60' y='200' class='m' text-anchor='middle'>CLRT = 1-37 ms</text><text x='60' y='218' class='s' text-anchor='middle'>(device-specific)</text><text x='700' y='46' class='t' text-anchor='middle'>PROTECTED: response parked until t_ack + G</text><text x='530' y='66' class='s' text-anchor='middle'>master</text><path d='M530,74 L530,300' class='dsh'/><text x='700' y='66' class='s' text-anchor='middle'>TOFINO</text><path d='M700,74 L700,300' class='dsh'/><text x='870' y='66' class='s' text-anchor='middle'>relay</text><path d='M870,74 L870,300' class='dsh'/><path d='M530,96 L866,96' class='ln' marker-end='url(#a)'/><text x='700' y='90' class='s' text-anchor='middle'>Class-0 READ</text><path d='M870,130 L534,130' class='ln' marker-end='url(#a)'/><text x='700' y='124' class='s' text-anchor='middle'>pure TCP ACK</text><circle cx='700' cy='130' r='4' class='norm'/><path d='M870,160 L706,160' class='ln' marker-end='url(#a)'/><text x='785' y='154' class='s' text-anchor='middle'>response</text><rect x='638' y='172' width='124' height='40' rx='4' class='hold'/><text x='700' y='188' class='s' text-anchor='middle'>HELD on Q_RESP</text><text x='700' y='204' class='s' text-anchor='middle'>blockers starve it</text><path d='M696,246 L534,246' class='ln' marker-end='url(#ah)'/><text x='618' y='240' class='s' text-anchor='middle'>released</text><path d='M516,130 L516,246' class='ln'/><text x='530' y='274' class='m' text-anchor='middle'>CLRT = G exactly</text><text x='530' y='292' class='s' text-anchor='middle'>sd 0.029 ms</text><text x='700' y='230' class='s' text-anchor='middle'>deadline t_ack + G</text></svg>