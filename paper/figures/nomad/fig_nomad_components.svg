<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 516 214" width="7.167in" height="2.972in" role="img" aria-labelledby="ncp-title ncp-desc"><title id="ncp-title">NOMAD components</title><desc id="ncp-desc">The control plane installs obfuscation objectives and constraints on one Tofino-1. In the data plane N parses and binds DNP3 transactions, T holds acknowledgments, responses and OPERATE commands in queues while blocker tokens recirculate, and E re-encodes responses and maps TCP sequence numbers. The three strategies are timing replacement, OPERATE hold and response splitting.</desc><rect width="516" height="214" fill="#ffffff"/><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="c2"><g transform="translate(0.5,0.5)"><rect x="2" y="90" width="66" height="40" fill="#ffffff" stroke="#aeb8c1" stroke-width="0.75" pointer-events="all"/></g><g><g fill="#222222" font-family="'Times New Roman'" text-anchor="middle" font-size="8px"><text x="35" y="108">SCADA</text><text x="35" y="118">master</text></g></g></g><g data-cell-id="c3"><g transform="translate(0.5,0.5)"><rect x="444" y="90" width="66" height="40" fill="#ffffff" stroke="#aeb8c1" stroke-width="0.75" pointer-events="all"/></g><g><g fill="#222222" font-family="'Times New Roman'" text-anchor="middle" font-size="8px"><text x="477" y="108">Outstation</text><text x="477" y="118">(IED)</text></g></g></g><g data-cell-id="c4"><g transform="translate(0.5,0.5)"><rect x="82" y="2" width="348" height="46" fill="#f4f6f8" stroke="#aeb8c1" stroke-width="0.75" pointer-events="all"/></g><g><g fill="#222222" font-family="'Times New Roman'" text-anchor="middle" font-size="8px"><text x="256" y="18">Obfuscation objectives and constraints (control plane)</text><text x="256" y="28">targets: CLRT D, OPERATE hold J, 61-byte responses;  envelope da, pb, readiness, cap from L, G</text><text x="256" y="38">constraints: packet availability, DNP3/TCP timers, IEEE 1815 conformance</text></g></g></g><g data-cell-id="c5"><g transform="translate(0.5,0.5)"><rect x="82" y="60" width="348" height="148" fill="#ffffff" stroke="#999999" stroke-width="0.75" stroke-dasharray="2.25 1.5" pointer-events="all"/></g></g><g data-cell-id="c6"><g><rect x="88" y="62" width="200" height="10" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#6B6B6B" font-family="'Times New Roman'" font-style="italic" text-anchor="start" font-size="8px"><text x="88" y="70">Obfuscation infrastructure (one Tofino-1)</text></g></g></g><g data-cell-id="c7"><g transform="translate(0.5,0.5)"><rect x="92" y="76" width="150" height="52" fill="#ffffff" stroke="#aeb8c1" stroke-width="0.75" pointer-events="all"/></g><g><g fill="#222222" font-family="'Times New Roman'" text-anchor="start" font-size="8px"><text x="95" y="90">Classifier</text><text x="95" y="100">parse DNP3: function code,</text><text x="95" y="110">object, qualifier, index ranges;</text><text x="95" y="120">bind transaction, record t0</text></g></g></g><g data-cell-id="c8"><g transform="translate(0.5,0.5)"><rect x="270" y="76" width="150" height="52" fill="#ffffff" stroke="#aeb8c1" stroke-width="0.75" pointer-events="all"/></g><g><g fill="#222222" font-family="'Times New Roman'" text-anchor="start" font-size="8px"><text x="273" y="90">Holder</text><text x="273" y="100">hold ACK, response, OPERATE</text><text x="273" y="110">in queues; blocker tokens</text><text x="273" y="120">recirculate until release</text></g></g></g><g data-cell-id="c9"><g transform="translate(0.5,0.5)"><rect x="270" y="140" width="150" height="52" fill="#ffffff" stroke="#aeb8c1" stroke-width="0.75" pointer-events="all"/></g><g><g fill="#222222" font-family="'Times New Roman'" text-anchor="start" font-size="8px"><text x="273" y="154">Rewriter</text><text x="273" y="164">re-encode responses by index</text><text x="273" y="174">ranges / transport frames;</text><text x="273" y="184">map TCP sequence numbers</text></g></g></g><g data-cell-id="c10"><g transform="translate(0.5,0.5)"><rect x="92" y="140" width="150" height="52" fill="#fbf3f8" stroke="#cc79a7" stroke-width="0.75" pointer-events="all"/></g><g><g fill="#222222" font-family="'Times New Roman'" text-anchor="start" font-size="8px"><text x="95" y="154">Obfuscation strategies</text><text x="95" y="164">S1 timing replacement (holder)</text><text x="95" y="174">S2 OPERATE hold (holder)</text><text x="95" y="184">S3 response splitting (rewriter)</text></g></g></g><g data-cell-id="c11"><g transform="translate(0.5,0.5)"><path d="M 73.41 110 L 76.59 110" fill="none" stroke="#222222" stroke-width="0.9" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 69.01 110 L 73.41 107.8 L 73.41 112.2 Z" fill="#222222" stroke="#222222" stroke-width="0.9" stroke-miterlimit="10" pointer-events="all"/><path d="M 80.99 110 L 76.59 112.2 L 76.59 107.8 Z" fill="#222222" stroke="#222222" stroke-width="0.9" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c12"><g transform="translate(0.5,0.5)"><path d="M 435.41 110 L 438.59 110" fill="none" stroke="#222222" stroke-width="0.9" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 431.01 110 L 435.41 107.8 L 435.41 112.2 Z" fill="#222222" stroke="#222222" stroke-width="0.9" stroke-miterlimit="10" pointer-events="all"/><path d="M 442.99 110 L 438.59 112.2 L 438.59 107.8 Z" fill="#222222" stroke="#222222" stroke-width="0.9" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c13"><g transform="translate(0.5,0.5)"><path d="M 242 102 L 264.59 102" fill="none" stroke="#0072b2" stroke-width="0.9" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 268.99 102 L 264.59 104.2 L 264.59 99.8 Z" fill="#0072b2" stroke="#0072b2" stroke-width="0.9" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c14"><g transform="translate(0.5,0.5)"><path d="M 345 128 L 345 134.59" fill="none" stroke="#0072b2" stroke-width="0.9" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 345 138.99 L 342.8 134.59 L 347.2 134.59 Z" fill="#0072b2" stroke="#0072b2" stroke-width="0.9" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c15"><g><rect x="248" y="90" width="22" height="10" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#6B6B6B" font-family="'Times New Roman'" text-anchor="middle" font-size="8px"><text x="259" y="98">timed</text></g></g></g><g data-cell-id="c16"><g transform="translate(0.5,0.5)"><path d="M 256 48 L 256 54.59" fill="none" stroke="#d55e00" stroke-width="0.9" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 256 58.99 L 253.8 54.59 L 258.2 54.59 Z" fill="#d55e00" stroke="#d55e00" stroke-width="0.9" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c17"><g><rect x="260" y="49" width="80" height="10" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#D55E00" font-family="'Times New Roman'" text-anchor="start" font-size="8px"><text x="260" y="57">installs policy</text></g></g></g></g></g></g></svg>