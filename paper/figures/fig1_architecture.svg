<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>

  <!-- Master -->
  <rect x="30" y="150" width="150" height="90" rx="6" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="105" y="188" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Master</text>
  <text x="105" y="209" text-anchor="middle" font-size="12" fill="#374151">(OpenDNP3)</text>
  <text x="105" y="227" text-anchor="middle" font-size="10.5" fill="#6b7280">link addr 1</text>

  <!-- Split-replay server container -->
  <rect x="330" y="40" width="400" height="350" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="530" y="66" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#111">Split-replay server</text>
  <text x="530" y="83" text-anchor="middle" font-size="11" fill="#6b7280">stands in for the outstation (TCP/20000, link addr 10)</text>

  <!-- internal pipeline blocks -->
  <rect x="360" y="100" width="340" height="42" rx="5" fill="#eef2ff" stroke="#4b5563" stroke-width="1.2"/>
  <text x="530" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111">Frame reassembler</text>
  <text x="530" y="135" text-anchor="middle" font-size="10.5" fill="#374151">whole DNP3 frames from the TCP stream (LEN field)</text>

  <rect x="360" y="152" width="340" height="42" rx="5" fill="#eef2ff" stroke="#4b5563" stroke-width="1.2"/>
  <text x="530" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111">Request parser + exchange map</text>
  <text x="530" y="187" text-anchor="middle" font-size="10.5" fill="#374151">match function code + app sequence; refuse unmatched</text>

  <rect x="360" y="204" width="340" height="52" rx="5" fill="#e7f0e9" stroke="#4b5563" stroke-width="1.2"/>
  <text x="530" y="224" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111">CRC-boundary splitter</text>
  <text x="530" y="240" text-anchor="middle" font-size="10.5" fill="#374151">cut only on existing CRC block boundaries</text>
  <text x="530" y="252" text-anchor="middle" font-size="10.5" font-style="italic" fill="#166534">invariant: b"".join(chunks) == response</text>

  <!-- captured responses store -->
  <rect x="360" y="286" width="150" height="76" rx="5" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="435" y="312" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111">Captured</text>
  <text x="435" y="328" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111">responses</text>
  <text x="435" y="346" text-anchor="middle" font-size="10" fill="#6b7280">from baseline PCAP</text>

  <!-- delivery mode note -->
  <rect x="540" y="286" width="160" height="76" rx="5" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="620" y="309" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">Delivery mode</text>
  <text x="620" y="326" text-anchor="middle" font-size="10" fill="#374151">full = verbatim replay</text>
  <text x="620" y="340" text-anchor="middle" font-size="10" fill="#374151">crc-boundary = split</text>
  <text x="620" y="354" text-anchor="middle" font-size="10" fill="#374151">both fragments split</text>

  <!-- flows between master and server -->
  <!-- READ request -->
  <line x1="180" y1="170" x2="330" y2="170" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="255" y="162" text-anchor="middle" font-size="10.5" fill="#111">READ request</text>

  <!-- split chunks response -->
  <line x1="330" y1="200" x2="180" y2="200" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="255" y="215" text-anchor="middle" font-size="10.5" fill="#111">split chunks (on CRC boundaries)</text>

  <!-- CONFIRM -->
  <line x1="180" y1="228" x2="330" y2="228" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrg)"/>
  <text x="255" y="245" text-anchor="middle" font-size="10.5" fill="#4b5563">DNP3 CONFIRM</text>

  <text x="105" y="290" text-anchor="middle" font-size="10" fill="#6b7280">reassembles the identical</text>
  <text x="105" y="303" text-anchor="middle" font-size="10" fill="#6b7280">application message</text>

  <text x="30" y="410" font-size="10.5" fill="#374151">Master command is unchanged: the server occupies the outstation's address and port.</text>
</svg>
