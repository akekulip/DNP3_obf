<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 0 560 250" font-family="Helvetica, Arial, sans-serif">
  <rect x="-6" width="560" height="250" fill="#ffffff"/>
  <text x="20" y="22" font-size="12.5" font-weight="700" fill="#2d3142">What the observer sees: native shape vs defended shape</text>

  <!-- native -->
  <text x="20" y="58" font-size="11" font-weight="600" fill="#2d3142">native response</text>
  <rect x="150" y="44" width="360" height="26" fill="#2d3142" fill-opacity="0.10" stroke="#2d3142"/>
  <text x="330" y="61" font-size="10" fill="#2d3142" text-anchor="middle">one TCP segment — 49 bytes</text>
  <text x="150" y="86" font-size="9" fill="#7a8399">observed shape: [49]  ·  timing: variable (median 1.3 ms read, 2.1 ms select)</text>

  <line x1="20" y1="104" x2="534" y2="104" stroke="#e6e8ec" stroke-width="1"/>

  <!-- defended -->
  <text x="20" y="138" font-size="11" font-weight="600" fill="#c0552b">defended response</text>
  <rect x="150" y="124" width="206" height="26" fill="#c0552b" fill-opacity="0.08" stroke="#c0552b"/>
  <text x="253" y="141" font-size="10" fill="#c0552b" text-anchor="middle">segment 1 — 28 bytes</text>
  <rect x="358" y="124" width="152" height="26" fill="#c0552b" fill-opacity="0.08" stroke="#c0552b"/>
  <text x="434" y="141" font-size="10" fill="#c0552b" text-anchor="middle">segment 2 — 21 bytes</text>
  <line x1="357" y1="118" x2="357" y2="156" stroke="#c0552b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="150" y="166" font-size="9" fill="#7a8399">observed shape: [28,21]  ·  timing: fixed policy value (≈4.0 ms)</text>

  <!-- total unchanged note -->
  <line x1="150" y1="184" x2="510" y2="184" stroke="#4f5d75" stroke-width="0.8"/>
  <path d="M150 180 V188 M510 180 V188" stroke="#4f5d75" stroke-width="0.8"/>
  <text x="330" y="200" font-size="9" fill="#4f5d75" text-anchor="middle">the reassembled response is still 49 bytes (28 + 21) — only the observed shape and timing change</text>

  <line x1="20" y1="216" x2="534" y2="216" stroke="#e6e8ec" stroke-width="1"/>
  <text x="20" y="234" font-size="9" fill="#4f5d75">The defense fixes the segment shape and the CLRT to a single policy value, so the read and select classes become</text>
  <text x="20" y="246" font-size="9" fill="#4f5d75">indistinguishable by these two features; it does not hide the total 49-byte length, which a full TCP reader still recovers.</text>
</svg>
