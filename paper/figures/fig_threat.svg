<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 0 560 260" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tm" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
  </defs>
  <rect x="-6" width="560" height="260" fill="#ffffff"/>
  <text x="20" y="22" font-size="12.5" font-weight="700" fill="#2d3142">Threat model: where the observer stands</text>

  <!-- trusted boundary -->
  <rect x="40" y="70" width="470" height="88" rx="8" fill="#2d3142" fill-opacity="0.03" stroke="#4f5d75" stroke-dasharray="5,4"/>
  <text x="52" y="88" font-size="9" fill="#7a8399" font-style="italic">trusted: endpoints, switch program, relay</text>

  <!-- nodes -->
  <rect x="60" y="100" width="110" height="40" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399"/>
  <text x="115" y="118" font-size="11" fill="#2d3142" text-anchor="middle" font-weight="600">master</text>
  <text x="115" y="132" font-size="8.5" fill="#7a8399" text-anchor="middle">control center</text>

  <rect x="270" y="100" width="110" height="40" rx="6" fill="#ffffff" stroke="#2d3142"/>
  <text x="325" y="118" font-size="11" fill="#2d3142" text-anchor="middle" font-weight="600">switch</text>
  <text x="325" y="132" font-size="8.5" fill="#7a8399" text-anchor="middle">on-path defense</text>

  <rect x="440" y="100" width="60" height="40" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399"/>
  <text x="470" y="118" font-size="11" fill="#2d3142" text-anchor="middle" font-weight="600">relay</text>
  <text x="470" y="132" font-size="8.5" fill="#7a8399" text-anchor="middle">outstation</text>

  <!-- links -->
  <line x1="170" y1="120" x2="270" y2="120" stroke="#4f5d75" stroke-width="1.4"/>
  <line x1="380" y1="120" x2="440" y2="120" stroke="#4f5d75" stroke-width="1.4"/>

  <!-- observed link (master-facing) -->
  <text x="220" y="112" font-size="8.5" fill="#c0552b" text-anchor="middle">observed</text>
  <path d="M220 150 V128" stroke="#c0552b" stroke-width="1.3" marker-end="url(#tm)"/>
  <polygon points="214,158 226,158 220,150" fill="#c0552b"/>
  <text x="220" y="176" font-size="10" fill="#c0552b" text-anchor="middle" font-weight="600">passive observer</text>
  <text x="220" y="189" font-size="8.5" fill="#7a8399" text-anchor="middle">reads TCP headers, segment sizes, arrival times</text>

  <!-- unobserved link (relay-facing) -->
  <text x="410" y="112" font-size="8.5" fill="#9aa1ad" text-anchor="middle">not observed</text>
  <line x1="410" y1="150" x2="410" y2="128" stroke="#9aa1ad" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="410" y="168" font-size="9" fill="#9aa1ad" text-anchor="middle">no relay-facing tap</text>
  <text x="410" y="180" font-size="8.5" fill="#9aa1ad" text-anchor="middle">(single-release timing</text>
  <text x="410" y="191" font-size="8.5" fill="#9aa1ad" text-anchor="middle">is modeled, not measured)</text>

  <line x1="20" y1="212" x2="534" y2="212" stroke="#e6e8ec" stroke-width="1"/>
  <text x="20" y="230" font-size="9" fill="#4f5d75">The adversary is passive on the master-facing link and reads only metadata (timing and segment sizes), not the meaning of</text>
  <text x="20" y="243" font-size="9" fill="#4f5d75">the unencrypted payload. What happens on the relay-facing link is outside the evaluated evidence.</text>
</svg>
