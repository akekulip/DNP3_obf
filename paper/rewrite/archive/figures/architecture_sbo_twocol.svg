<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="7.16in" height="4.54in" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DNP3 timing obfuscation with read and SBO queues</title>
  <desc id="desc">A two-column figure of the switch. Blue arrows carry requests from the DNP3 master to the SEL-751A outstation and green arrows carry acknowledgments and responses back. The read lane holds the acknowledgment and the response of a READ or SELECT behind blocker queues drained on an internal loopback; the control lane holds the OPERATE the same way.</desc>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56636d"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/></marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker>
    <style>
      .title{font-family:Times New Roman,Times,serif;fill:#17232d;font-size:21px;font-weight:700}
      .section{font-family:Times New Roman,Times,serif;fill:#24313b;font-size:15px;font-weight:700}
      .label{font-family:Times New Roman,Times,serif;fill:#33424d;font-size:14px}
      .small{font-family:Times New Roman,Times,serif;fill:#52616c;font-size:12px}
      .tiny{font-family:Times New Roman,Times,serif;fill:#5c6b75;font-size:12px}
      .queue{font-family:Times New Roman,Times,serif;fill:#1e2b34;font-size:13px;font-weight:700}
      .endpoint{font-family:Times New Roman,Times,serif;fill:#1e2b34;font-size:16px;font-weight:700}
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>

  <!-- Compact timing transform -->
  <rect x="365" y="13" width="470" height="38" rx="6" fill="#eaf5fb" stroke="#b7d9e8" stroke-width="1.3"/>
  <text x="390" y="37" class="section">CLRT<tspan font-size="11" baseline-shift="sub">original</tspan></text>
  <line x1="525" y1="31" x2="665" y2="31" stroke="#56636d" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="549" y="25" class="tiny">ACK / response gates</text>
  <text x="685" y="37" class="section">CLRT<tspan font-size="11" baseline-shift="sub">new</tspan></text>
  <text x="718" y="49" class="tiny">configured target</text>

  <!-- Endpoint trunks make every external path terminate at an endpoint. -->
  <line x1="190" y1="155" x2="190" y2="705" stroke="#a9b5bc" stroke-width="2"/>
  <line x1="1010" y1="155" x2="1010" y2="705" stroke="#a9b5bc" stroke-width="2"/>
  <rect x="20" y="285" width="150" height="90" rx="9" fill="#f7fafb" stroke="#65737e" stroke-width="1.8"/>
  <text x="95" y="325" class="endpoint" text-anchor="middle">Master</text>
  
  <rect x="1030" y="285" width="150" height="90" rx="9" fill="#f7fafb" stroke="#65737e" stroke-width="1.8"/>
  <text x="1105" y="325" class="endpoint" text-anchor="middle">SEL-751A</text>
  <text x="1105" y="347" class="small" text-anchor="middle">outstation</text>
  <line x1="170" y1="330" x2="190" y2="330" stroke="#a9b5bc" stroke-width="2"/>
  <line x1="1010" y1="330" x2="1030" y2="330" stroke="#a9b5bc" stroke-width="2"/>

  <!-- Switch boundary -->
  <rect x="215" y="70" width="770" height="650" rx="11" fill="#eaf5fb" stroke="#6e8795" stroke-width="1.8"/>
  <text x="600" y="101" class="title" text-anchor="middle">programmable switch (one P4 pipeline)</text>
  <text x="600" y="119" class="tiny" text-anchor="middle">timing only · payload unchanged</text>

  <!-- Forward request path: master to outstation -->
  <text x="246" y="143" class="small">READ / SELECT request</text>
  <line x1="190" y1="175" x2="250" y2="175" stroke="#0072B2" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="250" y="145" width="80" height="60" rx="6" fill="#f8fbfc" stroke="#aabac3" stroke-width="1.4"/>
  <text x="290" y="170" class="small" text-anchor="middle">DNP3</text>
  <text x="290" y="185" class="small" text-anchor="middle">parser</text>
  <line x1="330" y1="175" x2="355" y2="175" stroke="#56636d" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="355" y="145" width="110" height="60" rx="6" fill="#f8fbfc" stroke="#aabac3" stroke-width="1.4"/>
  <text x="410" y="170" class="small" text-anchor="middle">transaction</text>
  <text x="410" y="185" class="small" text-anchor="middle">classifier</text>
  <line x1="465" y1="175" x2="950" y2="175" stroke="#0072B2" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="700" y="163" class="tiny" text-anchor="middle">unmatched forward</text>
  <text x="914" y="143" class="small" text-anchor="middle">deparser</text>
  <line x1="950" y1="175" x2="1010" y2="175" stroke="#0072B2" stroke-width="3" marker-end="url(#arrow-green)"/>

  <!-- RRC read/SELECT return lane -->
  <text x="600" y="228" class="section" text-anchor="middle">read lane (READ, SELECT)</text>
  <line x1="1010" y1="310" x2="965" y2="310" stroke="#009E73" stroke-width="3" marker-end="url(#arrow-yellow)"/>
  <text x="1008" y="260" class="tiny" text-anchor="end">ACK / response</text>
  <rect x="835" y="270" width="130" height="160" rx="6" fill="#f8fbfc" stroke="#aabac3" stroke-width="1.4"/>
  <text x="900" y="340" class="small" text-anchor="middle">classify</text>
  <text x="900" y="356" class="small" text-anchor="middle">ACK / response</text>

  <!-- Queue ladder; arrows leave the queues toward the master. -->
  <g>
    <rect x="500" y="250" width="280" height="30" rx="5" fill="#ffffff" stroke="#91aab7" stroke-width="1.4"/>
    <text x="515" y="269" class="queue">ACK blockers</text>
    <line x1="755" y1="265" x2="700" y2="265" stroke="#56636d" stroke-width="1.7" marker-end="url(#arrow-gray)"/>
    <rect x="675" y="256" width="12" height="12" fill="#E69F00" stroke="#B37B00"/>
    <rect x="692" y="256" width="12" height="12" fill="#E69F00" stroke="#B37B00"/>
  </g>
  <g>
    <rect x="500" y="290" width="280" height="30" rx="5" fill="#ffffff" stroke="#91aab7" stroke-width="1.4"/>
    <text x="515" y="309" class="queue">held ACK</text>
    <line x1="835" y1="305" x2="780" y2="305" stroke="#009E73" stroke-width="2" marker-end="url(#arrow-yellow)"/>
    <line x1="755" y1="305" x2="700" y2="305" stroke="#56636d" stroke-width="1.7" marker-end="url(#arrow-gray)"/>
    <rect x="675" y="296" width="12" height="12" fill="#555555" stroke="#333333"/>
    
  </g>
  <g>
    <rect x="500" y="355" width="280" height="30" rx="5" fill="#ffffff" stroke="#91aab7" stroke-width="1.4"/>
    <text x="515" y="374" class="queue">response blockers</text>
    <line x1="755" y1="370" x2="700" y2="370" stroke="#56636d" stroke-width="1.7" marker-end="url(#arrow-gray)"/>
    <rect x="675" y="361" width="12" height="12" fill="#E69F00" stroke="#B37B00"/>
    <rect x="692" y="361" width="12" height="12" fill="#B37B00" stroke="#B37B00"/>
  </g>
  <g>
    <rect x="500" y="395" width="280" height="30" rx="5" fill="#ffffff" stroke="#91aab7" stroke-width="1.4"/>
    <text x="515" y="414" class="queue">held response</text>
    <line x1="835" y1="410" x2="780" y2="410" stroke="#009E73" stroke-width="2" marker-end="url(#arrow-yellow)"/>
    <line x1="755" y1="410" x2="700" y2="410" stroke="#56636d" stroke-width="1.7" marker-end="url(#arrow-gray)"/>
    <rect x="675" y="401" width="12" height="12" fill="#009E73" stroke="#00795A"/>
    
  </g>

  <!-- Queue release collector, with one complete return path to the master. -->
  <line x1="500" y1="265" x2="430" y2="265" stroke="#56636d" stroke-width="1.4"/>
  <line x1="500" y1="305" x2="430" y2="305" stroke="#56636d" stroke-width="1.4"/>
  <line x1="500" y1="370" x2="430" y2="370" stroke="#56636d" stroke-width="1.4"/>
  <line x1="500" y1="410" x2="430" y2="410" stroke="#56636d" stroke-width="1.4"/>
  <line x1="430" y1="265" x2="430" y2="410" stroke="#56636d" stroke-width="1.8"/>
  <rect x="330" y="305" width="90" height="55" rx="5" fill="#f8fbfc" stroke="#aabac3" stroke-width="1.4"/>
  <text x="375" y="329" class="small" text-anchor="middle">release</text>
  <text x="375" y="344" class="tiny" text-anchor="middle">to master</text>
  <line x1="330" y1="335" x2="190" y2="335" stroke="#009E73" stroke-width="3" marker-end="url(#arrow-yellow)"/>

  <!-- Timing labels and blocker loopback. -->
  <text x="610" y="244" class="small" fill="#D55E00"><tspan font-style="italic">D</tspan><tspan font-size="9" baseline-shift="sub" font-style="italic">A</tspan></text>
  <text x="610" y="349" class="small" fill="#D55E00"><tspan font-style="italic">D</tspan><tspan font-size="9" baseline-shift="sub" font-style="italic">R</tspan></text>
  <text x="610" y="447" class="small" fill="#D55E00" font-style="italic">ε</text>
  <rect x="730" y="455" width="180" height="34" rx="5" fill="#eef8fc" stroke="#8A8A8A" stroke-width="1.4"/>
  <text x="820" y="477" class="tiny" text-anchor="middle" fill="#555555">blocker loopback</text>
  <path d="M810 455 V265" fill="none" stroke="#8A8A8A" stroke-width="2"/>
  <line x1="810" y1="265" x2="780" y2="265" stroke="#8A8A8A" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="810" y1="370" x2="780" y2="370" stroke="#8A8A8A" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- BOR/SBO operate lane: request and released OPERATE travel right. -->
  <text x="600" y="505" class="section" text-anchor="middle">control lane (OPERATE)</text>
  <line x1="190" y1="580" x2="500" y2="580" stroke="#0072B2" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="300" y="566" class="small" text-anchor="middle">OPERATE request</text>
  <g>
    <rect x="500" y="530" width="280" height="30" rx="5" fill="#ffffff" stroke="#91aab7" stroke-width="1.4"/>
    <text x="515" y="549" class="queue">OPERATE blockers</text>
    <line x1="690" y1="545" x2="740" y2="545" stroke="#56636d" stroke-width="1.7" marker-end="url(#arrow-gray)"/>
    <rect x="648" y="536" width="12" height="12" fill="#E69F00" stroke="#B37B00"/>
    <rect x="665" y="536" width="12" height="12" fill="#E69F00" stroke="#B37B00"/>
  </g>
  <g>
    <rect x="500" y="570" width="280" height="30" rx="5" fill="#ffffff" stroke="#91aab7" stroke-width="1.4"/>
    <text x="515" y="589" class="queue">held OPERATE</text>
    <line x1="690" y1="585" x2="740" y2="585" stroke="#56636d" stroke-width="1.7" marker-end="url(#arrow-gray)"/>
    <rect x="648" y="576" width="12" height="12" fill="#0072B2" stroke="#005B8C"/>
    
  </g>
  <!-- BOR loopback enters the blocker queue from a routed internal path, without crossing the request. -->
  <rect x="730" y="637" width="180" height="32" rx="5" fill="#eef8fc" stroke="#8A8A8A" stroke-width="1.4"/>
  <text x="820" y="658" class="tiny" text-anchor="middle" fill="#555555">blocker loopback</text>
  <path d="M805 637 V515 H470 V545 H500" fill="none" stroke="#8A8A8A" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <!-- Common release path from both operation queues to the outstation. -->
  <line x1="780" y1="545" x2="820" y2="545" stroke="#56636d" stroke-width="1.4"/>
  <line x1="780" y1="585" x2="820" y2="585" stroke="#56636d" stroke-width="1.4"/>
  <line x1="820" y1="545" x2="820" y2="585" stroke="#56636d" stroke-width="1.8"/>
  <line x1="820" y1="585" x2="1010" y2="585" stroke="#0072B2" stroke-width="3" marker-end="url(#arrow-green)"/>
  <circle cx="860" cy="585" r="18" fill="#0072B2" stroke="#D55E00" stroke-width="1.4"/>
  <text x="860" y="591" text-anchor="middle" fill="#ffffff" font-weight="700" font-style="italic" font-family="Times New Roman,Times,serif" font-size="16px">J</text>
  <text x="860" y="617" class="tiny" text-anchor="middle">configured hold</text>
  <text x="975" y="566" class="small" text-anchor="end">released OPERATE</text>

  <!-- OPERATE response returns on its own complete path below the queue lane. -->
  <line x1="1010" y1="690" x2="190" y2="690" stroke="#009E73" stroke-width="3" marker-end="url(#arrow-yellow)"/>
  <text x="600" y="680" class="small" text-anchor="middle">OPERATE acknowledgment and response</text>

  <!-- Direction key -->
  <line x1="230" y1="742" x2="270" y2="742" stroke="#0072B2" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="281" y="746" class="tiny">request</text>
  <line x1="395" y1="742" x2="355" y2="742" stroke="#009E73" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <text x="405" y="746" class="tiny">ACK / response</text>
  <line x1="545" y1="742" x2="585" y2="742" stroke="#8A8A8A" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="595" y="746" class="tiny">internal loopback</text>
</svg>
