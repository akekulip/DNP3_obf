ill="#009e73" stroke="#009e73" stroke-width="0.95" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c28"><g><rect x="154" y="62.5" width="66" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2A36" font-family="'Times New Roman'" text-anchor="middle" font-size="8px"><text x="187" y="70">RESPONSE (0x81)</text></g></g></g><g data-cell-id="c29"><g transform="translate(0.5,0.5)"><path d="M 145.5 89 L 228.5 93.66" fill="none" stroke="#0072b2" stroke-width="0.95" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 233.44 93.94 L 228.36 96.13 L 228.64 91.19 Z" fill="#0072b2" stroke="#0072b2" stroke-width="0.95" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c30"><g><rect x="154" y="79.5" width="66" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2A36" font-family="'Times New Roman'" text-anchor="middle" font-size="8px"><text x="187" y="87">OPERATE (0x04)</text></g></g></g><g data-cell-id="c31"><g transform="translate(0.5,0.5)"><path d="M 234.5 106 L 151.5 110.66" fill="none" stroke="#555555" stroke-width="0.95" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 146.56 110.94 L 151.36 108.19 L 151.64 113.13 Z" fill="#555555" stroke="#555555" stroke-width="0.95" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c32"><g><rect x="154" y="96.5" width="66" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2A36" font-family="'Times New Roman'" text-anchor="middle" font-size="8px"><text x="187" y="104">TCP ACK</text></g></g></g><g data-cell-id="c33"><g transform="translate(0.5,0.5)"><path d="M 234.5 123 L 151.5 127.66" fill="none" stroke="#009e73" stroke-width="0.95" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 146.56 127.94 L 151.36 125.19 L 151.64 130.13 Z" fill="#009e73" stroke="#009e73" stroke-width="0.95" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c34"><g><rect x="154" y="1