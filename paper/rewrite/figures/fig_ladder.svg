<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 242" width="3.5in" height="3.361in" role="img" aria-labelledby="lad-title lad-desc">
<title id="lad-title">DNP3 transaction ladder</title>
<desc id="lad-desc">A READ poll and a select-before-operate control between master and outstation, with time running downwards. Requests are blue, transport acknowledgments grey, application responses green. On each panel the interval the master measures between the acknowledgment and the response is marked on the left, and the interval the outstation spends producing the answer is marked on the right; the two are equal in length because the common propagation cancels.</desc>
<defs>
  <marker id="hB" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#0072B2"/></marker>
  <marker id="hG" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#009E73"/></marker>
  <marker id="hK" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#555555"/></marker>
  <marker id="hR" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="3.6" markerHeight="3.6" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6 z" fill="#D55E00"/></marker>
  <marker id="hT" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#888888"/></marker>
</defs>
<rect width="252" height="242" fill="#ffffff"/>
<g font-family="Times New Roman, Times, serif" font-size="8" fill="#000000">

<!-- ============================== (a) READ ============================== -->
<text x="4" y="9" font-style="italic">(a) READ poll</text>
<text x="58" y="21" text-anchor="middle">Master</text>
<text x="194" y="21" text-anchor="middle">Outstation</text>
<line x1="58" y1="25" x2="58" y2="90" stroke="#0072B2" stroke-width="0.7" marker-end="url(#hB)"/>
<line x1="194" y1="25" x2="194" y2="90" stroke="#009E73" stroke-width="0.7" marker-end="url(#hG)"/>

<line x1="22" y1="30" x2="22" y2="86" stroke="#888888" stroke-width="0.6" marker-end="url(#hT)"/>
<text x="18" y="58" text-anchor="middle" transform="rotate(-90 18 58)" fill="#555555">Time</text>

<line x1="60" y1="34" x2="190" y2="42" stroke="#0072B2" stroke-width="0.9" marker-end="url(#hB)"/>
<text x="125" y="31" text-anchor="middle">READ request (function 1)</text>
<line x1="192" y1="54" x2="62" y2="62" stroke="#555555" stroke-width="0.9" marker-end="url(#hK)"/>
<text x="127" y="51" text-anchor="middle">TCP acknowledgment</text>
<line x1="192" y1="74" x2="62" y2="82" stroke="#009E73" stroke-width="0.9" marker-end="url(#hG)"/>
<text x="127" y="71" text-anchor="middle">application response (function 0x81)</text>

<line x1="44" y1="62" x2="44" y2="82" stroke="#D55E00" stroke-width="0.9" marker-start="url(#hR)" marker-end="url(#hR)"/>
<text x="40" y="75" text-anchor="end" font-style="italic" fill="#D55E00">c</text>
<line x1="208" y1="54" x2="208" y2="74" stroke="#555555" stroke-width="0.7" marker-start="url(#hR)" marker-end="url(#hR)" stroke-opacity="0.85"/>
<text x="212" y="61" fill="#555555">device</text>
<text x="212" y="70" fill="#555555">work</text>

<!-- ======================= (b) select-before-operate ======================= -->
<text x="4" y="104" font-style="italic">(b) Select-before-operate control</text>
<text x="58" y="115" text-anchor="middle">Master</text>
<text x="194" y="115" text-anchor="middle">Outstation</text>
<line x1="58" y1="119" x2="58" y2="234" stroke="#0072B2" stroke-width="0.7" marker-end="url(#hB)"/>
<line x1="194" y1="119" x2="194" y2="234" stroke="#009E73" stroke-width="0.7" marker-end="url(#hG)"/>

<line x1="60" y1="129" x2="190" y2="137" stroke="#0072B2" stroke-width="0.9" marker-end="url(#hB)"/>
<text x="125" y="126" text-anchor="middle">SELECT (function 3)</text>
<line x1="192" y1="147" x2="62" y2="155" stroke="#555555" stroke-width="0.9" marker-end="url(#hK)"/>
<text x="127" y="144" text-anchor="middle">TCP acknowledgment</text>
<line x1="192" y1="165" x2="62" y2="173" stroke="#009E73" stroke-width="0.9" marker-end="url(#hG)"/>
<text x="127" y="162" text-anchor="middle">SELECT response</text>
<line x1="60" y1="183" x2="190" y2="191" stroke="#0072B2" stroke-width="0.9" marker-end="url(#hB)"/>
<text x="125" y="180" text-anchor="middle">OPERATE (function 4)</text>
<line x1="192" y1="201" x2="62" y2="209" stroke="#555555" stroke-width="0.9" marker-end="url(#hK)"/>
<text x="127" y="198" text-anchor="middle">TCP acknowledgment</text>
<line x1="192" y1="219" x2="62" y2="227" stroke="#009E73" stroke-width="0.9" marker-end="url(#hG)"/>
<text x="127" y="216" text-anchor="middle">OPERATE response</text>

<line x1="44" y1="209" x2="44" y2="227" stroke="#D55E00" stroke-width="0.9" marker-start="url(#hR)" marker-end="url(#hR)"/>
<text x="40" y="221" text-anchor="end" font-style="italic" fill="#D55E00">O</text>
<line x1="208" y1="201" x2="208" y2="219" stroke="#555555" stroke-width="0.7" marker-start="url(#hR)" marker-end="url(#hR)" stroke-opacity="0.85"/>
<text x="212" y="207" fill="#555555">device</text>
<text x="212" y="216" fill="#555555">work</text>
</g>
</svg>
