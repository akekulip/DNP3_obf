<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 265 171" width="3.681in" height="2.375in" role="img" aria-labelledby="lad-title lad-desc"><title id="lad-title">DNP3 transaction ladder</title><desc id="lad-desc">Two DNP3 transactions between a SCADA master and the outstation, time running downwards, with DNP3 function codes in parentheses. Requests are blue, TCP acknowledgments grey and responses green. In (a), a READ is acknowledged by a TCP ACK and answered by a RESPONSE; CLRT runs from the TCP ACK to the RESPONSE at the master. In (b), a SELECT and an OPERATE are each acknowledged and answered, and the outstation later sends an UNSOLICITED RESPONSE reporting the state change; PRT runs from the OPERATE to the UNSOLICITED RESPONSE.</desc><rect width="265" height="171" fill="#ffffff"/><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="c2"><g><rect x="19" y="2" width="100" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#6B6B6B" font-family="'Times New Roman'" font-style="italic" text-anchor="middle" font-size="8px"><text x="69" y="9.5">(a) READ poll</text></g></g></g><g data-cell-id="c3"><g><rect x="13" y="13" width="46" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2A36" font-family="'Times New Roman'" text-anchor="middle" font-size="8px"><text x="36" y="20.5">Master</text></g></g></g><g data-cell-id="c4"><g><rect x="79" y="13" width="46" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2A36" font-family="'Times New Roman'" text-anchor="middle" font-size="8px"><text x="102" y="20.5">Outstation</text></g></g></g><g data-cell-id="c5"><g transform="translate(0.5,0.5)"><path d="M 36 26 L 36 164" fill="none" stroke="#9aa4ae" stroke-width="0.6" stroke-miterlimit="10" stroke-dasharray="1.2 1.2" pointer-events="stroke"/></g></g><g data-cell-id="c6"><g transform="translate(0.5,0.5)"><path d="M 102 26 L 102 164" fill="none" stroke="#9aa4ae" stroke-width="0.6" stroke-miterlimit="10" stroke-dasharray="1.2 1.2" pointer-events="stroke"/></g></g><g data-cell-id="c7"><g><rect x="140" y="2" width="100" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#6B6B6B" font-family="'Times New Roman'" font-style="italic" text-anchor="middle" font-size="8px"><text x="190" y="9.5">(b) Select-before-operate</text></g></g></g><g data-cell-id="c8"><g><rect x="121" y="13" width="46" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2A36" font-family="'Times New Roman'" text-anchor="middle" font-size="8px"><text x="144" y="20.5">Master</text></g></g></g><g data-cell-id="c9"><g><rect x="213" y="13" width="46" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2A36" font-family="'Times New Roman'" text-anchor="middle" font-size="8px"><text x="236" y="20.5">Outstation</text></g></g></g><g data-cell-id="c10"><g transform="translate(0.5,0.5)"><path d="M 144 26 L 144 164" fill="none" stroke="#9aa4ae" stroke-width="0.6" stroke-miterlimit="10" stroke-dasharray="1.2 1.2" pointer-events="stroke"/></g></g><g data-cell-id="c11"><g transform="translate(0.5,0.5)"><path d="M 236 26 L 236 164" fill="none" stroke="#9aa4ae" stroke-width="0.6" stroke-miterlimit="10" stroke-dasharray="1.2 1.2" pointer-events="stroke"/></g></g><g data-cell-id="c12"><g transform="translate(0.5,0.5)"><path d="M 37.5 38 L 94.51 42.52" fill="none" stroke="#0072b2" stroke-width="0.95" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 99.44 42.92 L 94.31 44.99 L 94.7 40.06 Z" fill="#0072b2" stroke="#0072b2" stroke-width="0.95" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c13"><g><rect x="33" y="28.5" width="66" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2A36" font-family="'Times New Roman'" text-anchor="middle" font-size="8px"><text x="66" y="36">READ (0x01)</text></g></g></g><g data-cell-id="c14"><g transform="translate(0.5,0.5)"><path d="M 100.5 58 L 43.49 62.52" fill="none" stroke="#555555" stroke-width="0.95" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 38.56 62.92 L 43.3 60.06 L 43.69 64.99 Z" fill="#555555" stroke="#555555" stroke-width="0.95" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c15"><g><rect x="33" y="48.5" width="66" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2A36" font-family="'Times New Roman'" text-anchor="middle" font-size="8px"><text x="66" y="56">TCP ACK</text></g></g></g><g data-cell-id="c16"><g transform="translate(0.5,0.5)"><path d="M 100.5 78 L 43.49 82.52" fill="none" stroke="#009e73" stroke-width="0.95" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 38.56 82.92 L 43.3 80.06 L 43.69 84.99 Z" fill="#009e73" stroke="#009e73" stroke-width="0.95" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c17"><g><rect x="33" y="68.5" width="66" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2A36" font-family="'Times New Roman'" text-anchor="middle" font-size="8px"><text x="66" y="76">RESPONSE (0x81)</text></g></g></g><g data-cell-id="c18"><g transform="translate(0.5,0.5)"><rect x="99" y="58" width="6" height="20" fill="#bfe6d9" stroke="#009e73" stroke-width="0.6" pointer-events="all"/></g></g><g data-cell-id="c19"><g transform="translate(0.5,0.5)"><path d="M 26 67.91 L 26 78.09" fill="none" stroke="#d55e00" stroke-width="0.9" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 26 64.01 L 27.95 67.91 L 24.05 67.91 Z" fill="#d55e00" stroke="#d55e00" stroke-width="0.9" stroke-miterlimit="10" pointer-events="all"/><path d="M 26 81.99 L 24.05 78.09 L 27.95 78.09 Z" fill="#d55e00" stroke="#d55e00" stroke-width="0.9" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c20"><g transform="translate(0.5,0.5)"><path d="M 26 63 L 35 63" fill="none" stroke="#d55e00" stroke-width="0.45" stroke-miterlimit="10"