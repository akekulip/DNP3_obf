<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 96" width="3.5in" height="1.333in" role="img" aria-labelledby="obs-title obs-desc">
<title id="obs-title">Observation model</title>
<desc id="obs-desc">The master reaches the SEL-751A outstation through one programmable switch. A passive observer sees only the master-facing link, drawn solid inside a shaded region; the relay-facing link and the two switch-internal scheduling lanes are dashed and are not observed.</desc>
<defs>
  <marker id="oR" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6 z" fill="#D55E00"/></marker>
  <marker id="oK" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6 z" fill="#888888"/></marker>
</defs>
<rect width="252" height="96" fill="#ffffff"/>
<g font-family="Times New Roman, Times, serif" font-size="8" fill="#000000">

<!-- the adversary's view: a pale zone with a small label above it, Ditto's idiom -->
<rect x="3" y="14" width="93" height="52" rx="2" fill="#D55E00" fill-opacity="0.05" stroke="#D55E00" stroke-opacity="0.45" stroke-width="0.6" stroke-dasharray="3,2"/>
<text x="3" y="11" fill="#D55E00" font-size="7.5">observed by the adversary</text>

<!-- nodes: outline only, no tinted fills -->
<rect x="10" y="32" width="42" height="18" rx="2" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
<text x="31" y="43.5" text-anchor="middle">Master</text>
<rect x="96" y="28" width="60" height="26" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<text x="126" y="38" text-anchor="middle">Programmable</text>
<text x="126" y="47" text-anchor="middle">switch</text>
<rect x="200" y="30" width="48" height="22" rx="2" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
<text x="224" y="38.5" text-anchor="middle">SEL-751A</text>
<text x="224" y="47.5" text-anchor="middle">outstation</text>

<!-- the two links. Only the observed one carries colour. -->
<line x1="52" y1="41" x2="94" y2="41" stroke="#D55E00" stroke-width="1.1" marker-start="url(#oR)" marker-end="url(#oR)"/>
<text x="73" y="33" text-anchor="middle" font-size="7.5" fill="#D55E00">master-facing</text>
<line x1="158" y1="41" x2="198" y2="41" stroke="#888888" stroke-width="0.9" stroke-dasharray="3,2" marker-start="url(#oK)" marker-end="url(#oK)"/>
<text x="178" y="33" text-anchor="middle" font-size="7.5" fill="#666666">relay-facing</text>

<!-- the tap -->
<line x1="73" y1="43" x2="73" y2="54" stroke="#D55E00" stroke-width="0.7" stroke-dasharray="2,1.5"/>
<circle cx="73" cy="56" r="2.2" fill="#D55E00"/>
<text x="70" y="64" text-anchor="middle" font-size="7" fill="#D55E00">passive observer</text>

<!-- the two switch-internal lanes, dashed: present, and not observed -->
<path d="M 106 54 L 106 62 Q 106 65 109 65 L 117 65 Q 120 65 120 62 L 120 54" fill="none" stroke="#555555" stroke-width="0.7" stroke-dasharray="2.5,2"/>
<path d="M 134 54 L 134 62 Q 134 65 137 65 L 145 65 Q 148 65 148 62 L 148 54" fill="none" stroke="#555555" stroke-width="0.7" stroke-dasharray="2.5,2"/>
<text x="113" y="74" text-anchor="middle" font-size="7.5" fill="#555555">read</text>
<text x="141" y="74" text-anchor="middle" font-size="7.5" fill="#555555">control</text>

<!-- legend: one line, solid against dashed, which is the whole distinction -->
<line x1="3" y1="80" x2="249" y2="80" stroke="#000000" stroke-opacity="0.2" stroke-width="0.5"/>
<line x1="4" y1="89" x2="22" y2="89" stroke="#D55E00" stroke-width="1.1"/>
<text x="26" y="92" font-size="7.5">observed</text>
<line x1="70" y1="89" x2="88" y2="89" stroke="#888888" stroke-width="0.9" stroke-dasharray="3,2"/>
<text x="92" y="92" font-size="7.5">not observed, no tap</text>
</g>
</svg>
