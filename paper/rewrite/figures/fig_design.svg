<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 214" width="3.5in" height="2.972in" role="img" aria-labelledby="des-title des-desc">
<title id="des-title">Design overview</title>
<desc id="des-desc">Inside one programmable switch, ingress classifies each DNP3 transaction and arms its release deadlines. The read lane holds the acknowledgment and the response of a READ or SELECT and releases them at t_A + D_A and t_A + D_A + CLRT_new, relative to the relay acknowledgment. The control lane holds an OPERATE with a configured release toward the relay at T0 + J (not observed) and releases its acknowledgment and response at T0 + A and T0 + R, relative to the request. The on-chip packet generator fills the blocker reservoirs of both lanes; a strict-priority scheduler drains the blockers first, which realizes each deadline. Unmatched traffic is forwarded unchanged.</desc>
<defs>
  <marker id="dK" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#2F3E4E"/></marker>
  <marker id="dR" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#D55E00"/></marker>
  <marker id="dK2" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#777777"/></marker>
  <marker id="dG" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#9AA4AE"/></marker>
</defs>
<rect width="252" height="214" fill="#ffffff"/>
<g font-family="Times New Roman, Times, serif" font-size="8" fill="#000000">
<rect x="34" y="6" width="190" height="186" rx="3" fill="#0072B2" fill-opacity="0.05" stroke="#0072B2" stroke-opacity="0.6" stroke-width="0.7" stroke-dasharray="3,2"/>
<text x="38" y="15" font-size="7.5" fill="#555555">programmable switch (one P4 pipeline)</text>
<text x="2" y="86" fill="#D55E00">from</text>
<text x="2" y="96" fill="#D55E00">master</text>
<line x1="2" y1="104" x2="43" y2="104" stroke="#D55E00" stroke-width="1.0" marker-end="url(#dR)"/>
<rect x="44" y="82" width="52" height="44" rx="2" fill="#ffffff" stroke="#2F3E4E" stroke-width="1.0"/>
<text x="70" y="99" text-anchor="middle">Ingress</text>
<text x="70" y="111" text-anchor="middle" font-size="7" fill="#555555">classify,</text>
<text x="70" y="120" text-anchor="middle" font-size="7" fill="#555555">arm, forward</text>
<path d="M 96 94 L 100 94 Q 102 94 102 92 L 102 60 Q 102 58 104 58 L 107 58" fill="none" stroke="#2F3E4E" stroke-width="0.9" marker-end="url(#dK)"/>
<path d="M 96 114 L 100 114 Q 102 114 102 116 L 102 138 Q 102 140 104 140 L 107 140" fill="none" stroke="#2F3E4E" stroke-width="0.9" marker-end="url(#dK)"/>
<rect x="108" y="28" width="110" height="52" rx="2" fill="#F4F6F8" stroke="#C5CCD3" stroke-width="0.8"/>
<text x="163" y="39" text-anchor="middle">read lane (READ, SELECT)</text>
<text x="163" y="51" text-anchor="middle">release ACK at t<tspan font-size="6" baseline-shift="sub">A</tspan> + D<tspan font-size="6" baseline-shift="sub">A</tspan></text>
<text x="163" y="62" text-anchor="middle">release response + CLRT<tspan font-size="6" baseline-shift="sub">new</tspan></text>
<g fill="#E69F00" fill-opacity="0.85">
<rect x="116" y="68" width="4" height="7"/><rect x="122" y="68" width="4" height="7"/><rect x="128" y="68" width="4" height="7"/><rect x="134" y="68" width="4" height="7"/>
</g>
<text x="142" y="74.5" font-size="7" fill="#555555">blockers</text>
<rect x="108" y="90" width="110" height="16" rx="2" fill="#ffffff" stroke="#9AA4AE" stroke-width="0.7"/>
<text x="163" y="101" text-anchor="middle" font-size="7.5" fill="#555555">packet generator</text>
<line x1="163" y1="90" x2="163" y2="81" stroke="#9AA4AE" stroke-width="0.7" stroke-dasharray="2,1.5" marker-end="url(#dG)"/>
<line x1="163" y1="106" x2="163" y2="115" stroke="#9AA4AE" stroke-width="0.7" stroke-dasharray="2,1.5" marker-end="url(#dG)"/>
<rect x="108" y="116" width="110" height="62" rx="2" fill="#F4F6F8" stroke="#C5CCD3" stroke-width="0.8"/>
<text x="163" y="127" text-anchor="middle">control lane (OPERATE)</text>
<text x="163" y="138" text-anchor="middle">release OPERATE at T<tspan font-size="6" baseline-shift="sub">0</tspan> + J</text>
<text x="163" y="148" text-anchor="middle">(configured, not observed)</text>
<text x="163" y="159" text-anchor="middle">ACK at T<tspan font-size="6" baseline-shift="sub">0</tspan> + A, response T<tspan font-size="6" baseline-shift="sub">0</tspan> + R</text>
<g fill="#E69F00" fill-opacity="0.85">
<rect x="116" y="166" width="4" height="7"/><rect x="122" y="166" width="4" height="7"/><rect x="128" y="166" width="4" height="7"/><rect x="134" y="166" width="4" height="7"/>
</g>
<text x="142" y="172.5" font-size="7" fill="#555555">blockers</text>
<line x1="218" y1="58" x2="238" y2="58" stroke="#D55E00" stroke-width="1.0" marker-end="url(#dR)"/>
<text x="250" y="52" text-anchor="end" fill="#D55E00">to master</text>
<line x1="218" y1="140" x2="238" y2="140" stroke="#D55E00" stroke-width="1.0" marker-end="url(#dR)"/>
<text x="250" y="134" text-anchor="end" fill="#D55E00">to master</text>
<line x1="218" y1="160" x2="238" y2="160" stroke="#777777" stroke-width="0.9" stroke-dasharray="3,2" marker-end="url(#dK2)"/>
<text x="250" y="172" text-anchor="end" fill="#555555">to relay</text>
<path d="M 70 126 L 70 196 Q 70 200 74 200 L 238 200" fill="none" stroke="#555555" stroke-width="0.8" stroke-dasharray="3,2" marker-end="url(#dK2)"/>
<rect x="92" y="194" width="118" height="12" fill="#ffffff"/>
<text x="151" y="203" text-anchor="middle" font-size="7.5">unmatched, forwarded unchanged</text>
<line x1="4" y1="209" x2="20" y2="209" stroke="#D55E00" stroke-width="1.0"/>
<text x="24" y="212">observed by the adversary</text>
<line x1="122" y1="209" x2="138" y2="209" stroke="#777777" stroke-width="0.9" stroke-dasharray="3,2"/>
