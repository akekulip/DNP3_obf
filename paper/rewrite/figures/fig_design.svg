<line x1="218" y1="160" x2="238" y2="160" stroke="#2BA02B" stroke-width="0.9" stroke-dasharray="3,2" marker-end="url(#dG)"/>
<text x="250" y="172" text-anchor="end" fill="#2BA02B">to relay</text>
<path d="M 73 188 L 73 200 L 238 200" fill="none" stroke="#000000" stroke-width="0.8" stroke-dasharray="3,2" marker-end="url(#dK)"/>
<rect x="92" y="194" width="118" height="12" fill="#ffffff"/>
