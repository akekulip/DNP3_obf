<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 168" width="3.5in" height="2.333in" role="img" aria-labelledby="des-title des-desc">
<title id="des-title">Design overview</title>
<desc id="des-desc">Ingress anchors deadlines to the request arrival; two independent scheduling lanes hold the read and control answers behind blocker reservoirs drained by a strict-priority scheduler; unmatched traffic bypasses the treatment.</desc>
