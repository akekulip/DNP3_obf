<text x="73" y="94" text-anchor="middle">transaction</text>
<text x="73" y="112" text-anchor="middle">arm release</text>
<text x="73" y="122" text-anchor="middle">deadlines</text>
<text x="73" y="140" text-anchor="middle">forward the</text>
<text x="73" y="150" text-anchor="middle">request</text>
