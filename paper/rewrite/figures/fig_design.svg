<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 246 132" width="3.417in" height="1.833in" role="img" aria-labelledby="des-title des-desc"><title id="des-title">Design overview</title><desc id="des-desc">Inside one programmable switch, ingress classifies every arrival, from the master or back from the relay, and arms its release deadlines. The read lane holds the acknowledgment and the response of a READ or SELECT, and the control lane holds an OPERATE, each behind a queue of generated blocker packets that a strict-priority scheduler drains first, which is what realizes the deadline. The on-chip packet generator keeps the blocker queues non-empty.</desc><rect width="246" height="132" fill="#ffffff"/><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="c2"><g transform="translate(0.5,0.5)"><rect x="31" y="2" width="204" height="124" rx="2.48" ry="2.48" fill="#f7f8fa" stroke="#c5ccd3" stroke-width="0.7" pointer-events="all"/></g></g><g data-cell-id="c3"><g><rect x="31" y="114" width="204" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#6B6B6B" font-family="'Times New Roman'" text-anchor="middle" font-size="7px"><text x="133" y="121">programmable switch (one P4 pipeline)</text></g></g></g><g data-cell-id="c4"><g transform="translate(0.5,0.5)"><path d="M 30 75 L 38.4 51 L 63.6 51 L 72 75 Z" fill="#e7ebef" stroke="#2f3e4e" stroke-width="0.7" stroke-miterlimit="10" transform="rotate(270,51,63)" pointer-events="all"/></g></g><g data-cell-id="c5"><g><rect x="35" y="86" width="32" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#6B6B6B" font-family="'Times New Roman'" text-anchor="middle" font-size="7px"><text x="51" y="93">classify,</text></g></g></g><g data-cell-id="c6"><g><rect x="35" y="94" width="32" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#6B6B6B" font-family="'Times New Roman'" text-anchor="middle" font-size="7px"><text x="51" y="101">arm</text></g></g></g><g data-cell-id="c7"><g transform="translate(0.5,0.5)"><path d="M 7 54 L 31.46 54" fill="none" stroke="#d55e00" stroke-width="1.2" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 36.66 54 L 31.46 56.6 L 31.46 51.4 Z" fill="#d55e00" stroke="#d55e00" stroke-width="1.2" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c8"><g><rect x="5" y="45" width="32" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#D55E00" font-family="'Times New Roman'" text-anchor="middle" font-size="7px"><text x="21" y="52">from master</text></g></g></g><g data-cell-id="c9"><g transform="translate(0.5,0.5)"><path d="M 7 72 L 32.09 72" fill="none" stroke="#555555" stroke-width="0.9" stroke-miterlimit="10" stroke-dasharray="2.7 1.8" pointer-events="stroke"/><path d="M 36.99 72 L 32.09 74.45 L 32.09 69.55 Z" fill="#555555" stroke="#555555" stroke-width="0.9" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c10"><g><rect x="5" y="74" width="32" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#6B6B6B" font-family="'Times New Roman'" text-anchor="middle" font-size="7px"><text x="21" y="81">from relay</text></g></g></g><g data-cell-id="c11"><g><rect x="77" y="6" width="120" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#2F3E4E" font-family="'Times New Roman'" text-anchor="start" font-size="7.5px"><text x="77" y="13.25">read lane (READ, SELECT)</text></g></g></g><g data-cell-id="c12"><g transform="translate(0.5,0.5)"><rect x="77" y="14" width="7.43" height="8" fill="#ffffff" stroke="#c5ccd3" stroke-width="0.5" pointer-events="all"/></g></g><g data-cell-id="c13"><g transform="translate(0.5,0.5)"><rect x="84.43" y="14" width="7.43" height="8" fill="#ffffff" stroke="#c5ccd3" stroke-width="0.5" pointer-events="all"/></g></g><g data-cell-id="c14"><g transform="translate(0.5,0.5)"><rect x="91.86" y="14" width="7.43" height="8" fill="#ffff