</g>
<text x="142" y="74.5" fill="#B35A00">blockers, strict priority</text>
<rect x="108" y="90" width="110" height="16" rx="2" fill="#FF800E" fill-opacity="0.10" stroke="#FF800E" stroke-width="0.9"/>
<text x="163" y="101" text-anchor="middle" fill="#B35A00">on-chip packet generator</text>
<line x1="163" y1="90" x2="163" y2="81" stroke="#FF800E" stroke-width="0.8" stroke-dasharray="2,1.5" marker-end="url(#dO)"/>
<line x1="163" y1="106" x2="163" y2="115" stroke="#FF800E" stroke-width="0.8" stroke-dasharray="2,1.5" marker-end="url(#dO)"/>
