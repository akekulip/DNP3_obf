<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 261 120" width="3.625in" height="1.667in" role="img" aria-labelledby="des-title des-desc"><title id="des-title">Design overview</title><desc id="des-desc">The drawing reads left to right. The outstation and the master sit outside one programmable switch. Inside it, ingress classifies each arrival and arms its release deadlines; the read lane holds the acknowledgment and the response of a READ or SELECT, and the control lane holds an OPERATE. Each held packet waits behind a queue of blocker packets the switch generates, which a strict-priority scheduler drains first, and the blocker loopback returns into those queues without reaching a cable.</desc><rect width="261" height="120" fill="#ffffff"/><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="c2"><g transform="translate(0.5,0.5)"><rect x="47" y="3" width="172" height="110" rx="2.2" ry="2.2" fill="#f7f8fa" stroke="#c5ccd3" stroke-width="0.7" pointer-events="all"/></g></g><g data-cell-id="c3"><g><rect x="47" y="105" width="172" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#6B6B6B" font-family="'Times New Roman'" text-anchor="middle" font-size="8px"><text x="133" y="112.5">programmable switch</text></g></g></g><g data-cell-id="c4"><g transform="translate(0.5,0.5)"><rect x="7" y="27" width="30" height="15" rx="2.7" ry="2.7" fill="#ffffff" stroke="#2f3e4e" stroke-width="0.7" pointer-events="all"/></g><g><g fill="#2F3E4E" font-family="'Times New Roman'" text-anchor="middle" font-size="7px"><text x="22" y="37">Outstation</text></g></g></g><g data-cell-id="c5"><g transform="translate(0.5,0.5)"><rect x="223" y="27" width="30" height="15" rx="2.7" ry="2.7" fill="#ffffff" stroke="#2f3e4e" stroke-width="0.7" pointer-events="all"/></g><g><g fill="#2F3E4E" font-family="'Times New Roman'" text-anchor="middle" font-size="7px"><text x="238" y="37">Master</text></g></g></g><g data-cell-id="c6"