<line x1="102" y1="140" x2="107" y2="140" stroke="#000000" stroke-width="0.9" marker-end="url(#dK)"/>
<rect x="108" y="28" width="110" height="52" rx="2" fill="#2BA02B" fill-opacity="0.08" stroke="#2BA02B" stroke-width="1.0"/>
<text x="163" y="39" text-anchor="middle" font-weight="bold" fill="#2BA02B">read lane (READ, SELECT)</text>
<text x="163" y="51" text-anchor="middle">hold ACK, release t<tspan font-size="6" baseline-shift="sub">A</tspan> + D<tspan font-size="6" baseline-shift="sub">A</tspan></text>
<text x="163" y="62" text-anchor="middle">hold response, release + D<tspan font-size="6" baseline-shift="sub">R</tspan></text>
<g fill="#FF800E" fill-opacity="0.85">
