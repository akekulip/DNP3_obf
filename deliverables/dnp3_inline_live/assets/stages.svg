<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 930 442' preserveAspectRatio='xMidYMid meet'><style>text{fill:#14202c}.t{font-family='Helvetica,Arial,sans-serif';font-size:13px} .h{font-family='Helvetica,Arial,sans-serif';font-size:15px;font-weight:bold}.s{font-family='Helvetica,Arial,sans-serif';font-size:11px;fill:#5a6b7a} .m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}.box{fill:#f2f5f9;stroke:#2f4a63;stroke-width:1.5}.sw{fill:#e7effa;stroke:#1e5f9e;stroke-width:2}.hold{fill:#fdf1e0;stroke:#b87514;stroke-width:1.6}.norm{fill:#e6f4f1;stroke:#1f7a6b;stroke-width:1.6}.bad{fill:#fbeaee;stroke:#a8324a;stroke-width:1.6}.ln{stroke:#2f4a63;stroke-width:1.6;fill:none}.dsh{stroke:#8496a6;stroke-width:1.2;stroke-dasharray:5 4;fill:none}@media(prefers-color-scheme:dark){text{fill:#e4eaf1}.s{fill:#8b9aaa}.box{fill:#1b232c;stroke:#7fa3c4}.sw{fill:#16283a;stroke:#5aa6e8}.hold{fill:#33260f;stroke:#e0a448}.norm{fill:#12302b;stroke:#4fbfa9}.bad{fill:#331a20;stroke:#e0697f}.ln{stroke:#9ab}.dsh{stroke:#7c8a99}}</style><defs><marker id='a' markerWidth='10' markerHeight='10' refX='9' refY='3' orient='auto'><path d='M0,0 L9,3 L0,6 Z' fill='#2f4a63'/></marker><marker id='ah' markerWidth='10' markerHeight='10' refX='9' refY='3' orient='auto'><path d='M0,0 L9,3 L0,6 Z' fill='#b87514'/></marker></defs><text x='470' y='24' class='h' text-anchor='middle'>Ingress pipeline: role decides fate</text><rect x='20' y='52' width='128' height='56' rx='4' class='box'/><text x='84' y='74' class='t' text-anchor='middle'>parser</text><text x='84' y='94' class='m' text-anchor='middle'>ingress_port</text><path d='M148,80 L194,80' class='ln' marker-end='url(#a)'/><rect x='196' y='52' width='150' height='56' rx='4' class='box'/><text x='271' y='74' class='t' text-anchor='middle'>classify role</text><text x='271' y='94' class='m' text-anchor='middle'>0x88C1 &#8594; BLOCK</text><rect x='196' y='140' width='150' height='42' rx='4' class='norm'/><text x='271' y='166' class='m' text-anchor='middle'>READ (master &#8594; relay)</text><path d='M346,161 L392,161' class='ln' marker-end='url(#a)'/><rect x='394' y='140' width='520' height='42' rx='4' class='norm'/><text x='654' y='166' class='m' text-anchor='middle'>forward now; reg_gen := app-control byte</text><rect x='196' y='196' width='150' height='42' rx='4' class='norm'/><text x='271' y='222' class='m' text-anchor='middle'>ACK  (relay &#8594; master)</text><path d='M346,217 L392,217' class='ln' marker-end='url(#a)'/><rect x='394' y='196' width='520' height='42' rx='4' class='norm'/><text x='654' y='222' class='m' text-anchor='middle'>forward now; reg_t_ack, reg_deadline := t_ack+G</text><rect x='196' y='252' width='150' height='42' rx='4' class='hold'/><text x='271' y='278' class='m' text-anchor='middle'>RESPONSE (relay)</text><path d='M346,273 L392,273' class='ln' marker-end='url(#a)'/><rect x='394' y='252' width='520' height='42' rx='4' class='hold'/><text x='654' y='278' class='m' text-anchor='middle'>egress = dp8, qid = Q_RESP  &#8594;  HELD</text><rect x='196' y='308' width='150' height='42' rx='4' class='hold'/><text x='271' y='334' class='m' text-anchor='middle'>BLOCKER token</text><path d='M346,329 L392,329' class='ln' marker-end='url(#a)'/><rect x='394' y='308' width='520' height='42' rx='4' class='hold'/><text x='654' y='334' class='m' text-anchor='middle'>early: requeue Q_BLOCK   late: drop &#8594; release</text><rect x='196' y='364' width='150' height='42' rx='4' class='box'/><text x='271' y='390' class='m' text-anchor='middle'>anything else</text><path d='M346,385 L392,385' class='ln' marker-end='url(#a)'/><rect x='394' y='364' width='520' height='42' rx='4' class='box'/><text x='654' y='390' class='m' text-anchor='middle'>ROLE_BYPASS: forwarded untouched (ARP, ICMP)</text><path d='M271,108 L271,140' class='ln' marker-end='url(#a)'/><text x='470' y='424' class='s' text-anchor='middle'>10 of 12 ingress stages, 0 egress. The response is queued and later dequeued, never rewritten.</text></svg>