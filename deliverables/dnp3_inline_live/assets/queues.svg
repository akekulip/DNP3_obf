<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 930 244' preserveAspectRatio='xMidYMid meet'><style>text{fill:#14202c}.t{font-family='Helvetica,Arial,sans-serif';font-size:13px} .h{font-family='Helvetica,Arial,sans-serif';font-size:15px;font-weight:bold}.s{font-family='Helvetica,Arial,sans-serif';font-size:11px;fill:#5a6b7a} .m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}.box{fill:#f2f5f9;stroke:#2f4a63;stroke-width:1.5}.sw{fill:#e7effa;stroke:#1e5f9e;stroke-width:2}.hold{fill:#fdf1e0;stroke:#b87514;stroke-width:1.6}.norm{fill:#e6f4f1;stroke:#1f7a6b;stroke-width:1.6}.bad{fill:#fbeaee;stroke:#a8324a;stroke-width:1.6}.ln{stroke:#2f4a63;stroke-width:1.6;fill:none}.dsh{stroke:#8496a6;stroke-width:1.2;stroke-dasharray:5 4;fill:none}@media(prefers-color-scheme:dark){text{fill:#e4eaf1}.s{fill:#8b9aaa}.box{fill:#1b232c;stroke:#7fa3c4}.sw{fill:#16283a;stroke:#5aa6e8}.hold{fill:#33260f;stroke:#e0a448}.norm{fill:#12302b;stroke:#4fbfa9}.bad{fill:#331a20;stroke:#e0697f}.ln{stroke:#9ab}.dsh{stroke:#7c8a99}}</style><defs><marker id='a' markerWidth='10' markerHeight='10' refX='9' refY='3' orient='auto'><path d='M0,0 L9,3 L0,6 Z' fill='#2f4a63'/></marker><marker id='ah' markerWidth='10' markerHeight='10' refX='9' refY='3' orient='auto'><path d='M0,0 L9,3 L0,6 Z' fill='#b87514'/></marker></defs><text x='430' y='24' class='h' text-anchor='middle'>Why the response cannot leave: strict priority on the dp8 loopback</text><rect x='40' y='52' width='340' height='150' rx='4' class='box'/><text x='210' y='74' class='t' text-anchor='middle'>dp8: internal MAC-near loopback</text><rect x='60' y='90' width='300' height='44' rx='4' class='hold'/><text x='210' y='108' class='m' text-anchor='middle'>Q_BLOCK   qid 7   max_priority = 7</text><circle cx='78' cy='124' r='4' class='hold'/><circle cx='111' cy='124' r='4' class='hold'/><circle cx='144' cy='124' r='4' class='hold'/><circle cx='177' cy='124' r='4' class='hold'/><circle cx='210' cy='124' r='4' class='hold'/><circle cx='243' cy='124' r='4' class='hold'/><circle cx='276' cy='124' r='4' class='hold'/><circle cx='309' cy='124' r='4' class='hold'/><circle cx='342' cy='124' r='4' class='hold'/><text x='210' y='150' class='s' text-anchor='middle'>64 blocker tokens, circulating</text><rect x='60' y='156' width='300' height='34' rx='4' class='norm'/><text x='210' y='177' class='m' text-anchor='middle'>Q_RESP   qid 1   max_priority = 0</text><rect x='430' y='52' width='220' height='150' rx='4' class='box'/><text x='540' y='74' class='t' text-anchor='middle'>traffic manager</text><text x='540' y='100' class='s' text-anchor='middle'>serve highest non-empty</text><text x='540' y='122' class='m' text-anchor='middle'>Q_BLOCK occupied</text><text x='540' y='142' class='t' text-anchor='middle'>&#8595;</text><text x='540' y='162' class='m' text-anchor='middle'>Q_RESP never selected</text><text x='540' y='186' class='s' text-anchor='middle'>the response waits</text><rect x='700' y='52' width='200' height='150' rx='4' class='bad'/><text x='800' y='74' class='t' text-anchor='middle'>two ways to get it wrong</text><text x='800' y='100' class='m' text-anchor='middle'>min_priority only</text><text x='800' y='118' class='s' text-anchor='middle'>&#8594; fair share, leaks</text><text x='800' y='146' class='m' text-anchor='middle'>K &lt; 64 tokens</text><text x='800' y='164' class='s' text-anchor='middle'>&#8594; queue empties in</text><text x='800' y='180' class='s' text-anchor='middle'>flight, escapes ~540 ns</text><path d='M380,127 L428,127' class='ln' marker-end='url(#a)'/><path d='M650,127 L698,127' class='ln' marker-end='url(#a)'/><text x='430' y='226' class='s' text-anchor='middle'>The gate is absolute only when max_priority is set AND enough tokens are in flight to cover a full pipeline+loopback traversal.</text></svg>