<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$title$</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#666;--line:#dcdfe3;--acc:#1f6feb;--code:#f5f6f8;--sidebar:#f7f8fa}
@media(prefers-color-scheme:dark){:root{--bg:#0f1418;--fg:#e6e8ea;--muted:#9aa4ad;--line:#2a323a;--acc:#589bff;--code:#161c22;--sidebar:#121820}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
#layout{display:flex;align-items:flex-start}
#sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;width:290px;min-width:290px;background:var(--sidebar);border-right:1px solid var(--line);padding:22px 18px}
#sidebar h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 10px}
#sidebar ul{list-style:none;margin:0;padding:0}
#sidebar li{margin:2px 0}
#sidebar a{color:var(--fg);text-decoration:none;font-size:13.5px;display:block;padding:3px 6px;border-radius:5px;line-height:1.35}
#sidebar a:hover{background:rgba(127,127,127,.15)}
#sidebar ul ul{padding-left:14px}
main{flex:1;max-width:820px;margin:0 auto;padding:36px 40px 80px}
h1{font-size:1.9em;line-height:1.2;margin:.2em 0 .1em}
.subtitle{color:var(--muted);font-size:1.15em;margin:0 0 1em}
h1[id]{border-bottom:1px solid var(--line);padding-bottom:.2em;margin-top:1.6em}
h2,h3{margin-top:1.5em}
a{color:var(--acc)}
img{max-width:100%;height:auto;display:block;margin:1.1em auto;border:1px solid var(--line);border-radius:6px;background:#fff}
figcaption,.caption{color:var(--muted);font-size:.88em;text-align:center;margin:-.6em 0 1.4em}
pre{position:relative;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:14px 14px;overflow-x:auto}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em}
p code,li code{background:var(--code);padding:.1em .35em;border-radius:4px}
details{border:1px solid var(--line);border-radius:8px;padding:.4em .8em;margin:1em 0;background:var(--sidebar)}
summary{cursor:pointer;font-weight:600;color:var(--acc)}
details[open] summary{margin-bottom:.6em}
table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:.92em;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left}
th{background:var(--sidebar)}
.buildinfo{color:var(--muted);font-size:.85em;border-left:3px solid var(--acc);padding:.4em .9em;background:var(--sidebar);border-radius:0 6px 6px 0}
.copybtn{position:absolute;top:7px;right:7px;font-size:11px;padding:3px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--muted);cursor:pointer;opacity:0;transition:opacity .15s}
pre:hover .copybtn{opacity:1}
.copybtn.ok{color:#2ca02c;border-color:#2ca02c}
#menu-toggle{display:none}
@media(max-width:820px){
  #sidebar{position:fixed;left:-300px;z-index:20;transition:left .2s;box-shadow:2px 0 12px rgba(0,0,0,.2)}
  #sidebar.open{left:0}
  #menu-toggle{display:block;position:fixed;top:12px;left:12px;z-index:30;background:var(--acc);color:#fff;border:none;border-radius:6px;padding:8px 12px;font-size:16px;cursor:pointer}
  main{padding:60px 20px 60px}
}
@media print{
  #sidebar{position:static;height:auto;width:100%;min-width:0;border:none;background:none;page-break-after:always}
  #sidebar a{color:#000}
  #menu-toggle{display:none}
  main{max-width:none;padding:0}
  .copybtn{display:none}
  details{border:none;background:none;padding:0}
  details summary{display:none}
  details[open]>*{display:revert}
  details>*{display:block!important}
  pre{white-space:pre-wrap;word-break:break-word}
  h1[id]{page-break-before:always}
  h1:first-of-type{page-break-before:avoid}
  img{page-break-inside:avoid}
  body{font-size:11pt}
}
</style>
</head>
<body>
<button id="menu-toggle" aria-label="Toggle navigation">☰</button>
<div id="layout">
<nav id="sidebar">
<h2>Contents</h2>
$table-of-contents$
</nav>
<main>
<h1 class="doctitle">$title$</h1>
$if(subtitle)$<p class="subtitle">$subtitle$</p>$endif$
$body$
</main>
</div>
<script>
document.querySelectorAll('main pre').forEach(function(pre){
  var b=document.createElement('button');b.className='copybtn';b.textContent='Copy';
  b.addEventListener('click',function(){
    var code=pre.querySelector('code');var t=code?code.innerText:pre.innerText;
    navigator.clipboard.writeText(t).then(function(){b.textContent='Copied';b.classList.add('ok');
      setTimeout(function(){b.textContent='Copy';b.classList.remove('ok');},1400);});
  });
  pre.appendChild(b);
});
var tgl=document.getElementById('menu-toggle'),sb=document.getElementById('sidebar');
if(tgl){tgl.addEventListener('click',function(){sb.classList.toggle('open');});
  sb.addEventListener('click',function(e){if(e.target.tagName==='A')sb.classList.remove('open');});}
</script>
</body>
</html>
