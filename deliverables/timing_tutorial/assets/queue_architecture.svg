<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 780 320' width='780' height='320'><style>text{fill:#111} .t{font-family='Helvetica,Arial,sans-serif';font-size:13px} .h{font-family='Helvetica,Arial,sans-serif';font-size:16px;font-weight:bold}.s{font-family='Helvetica,Arial,sans-serif';font-size:11px;fill:#555} .box{fill:#f4f6f8;stroke:#345;stroke-width:1.5}.hi{fill:#e8f5e9;stroke:#2ca02c;stroke-width:1.5} .blk{fill:#fdecea;stroke:#d62728;stroke-width:1.5}.acc{fill:#e7effa;stroke:#1f77b4;stroke-width:1.5} .ln{stroke:#345;stroke-width:1.5;fill:none}.dsh{stroke:#888;stroke-width:1.2;stroke-dasharray:5 4;fill:none}@media(prefers-color-scheme:dark){text{fill:#e8e8e8}.s{fill:#aaa}.box{fill:#20272e;stroke:#7a9cc6}.hi{fill:#16321c;stroke:#4caf7d}.blk{fill:#3a1d1d;stroke:#e06666}.acc{fill:#1b2a3d;stroke:#6fa8dc}.ln{stroke:#9ab}.dsh{stroke:#999}}</style><defs><marker id='a' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto'><path d='M0,0 L9,3 L0,6 Z' fill='#345'/></marker><marker id='ag' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto'><path d='M0,0 L9,3 L0,6 Z' fill='#2ca02c'/></marker></defs><text x='20' y='30' class='h'>Diagram 3 — Traffic Manager queues (strict priority)</text><rect x='80' y='70' width='300' height='60' rx='6' class='blk'/><text x='230' y='97' text-anchor='middle' class='t'>Q_BLOCK  (qid 7)  — HIGH priority</text><text x='230' y='113' text-anchor='middle' class='s'>holds recirculating blocker tokens</text><rect x='80' y='170' width='300' height='60' rx='6' class='hi'/><text x='230' y='197' text-anchor='middle' class='t'>Q_RESP  (qid 1)  — LOW priority</text><text x='230' y='213' text-anchor='middle' class='s'>holds the ONE original response, unmodified</text><rect x='470' y='110' width='260' height='70' rx='6' class='acc'/><text x='600' y='142' text-anchor='middle' class='t'>TM scheduler</text><text x='600' y='158' text-anchor='middle' class='s'>serves highest-priority non-empty queue</text><path d='M380,100 L468,125' class='ln' marker-end='url(#a)'/><text x='424' y='108' text-anchor='middle' class='s'>served first (while non-empty)</text><path d='M380,200 L468,165' class='ln' marker-end='url(#a)'/><text x='424' y='178' text-anchor='middle' class='s'>starved while Q_BLOCK non-empty</text><text x='80' y='280' class='s'>While ANY blocker token is eligible in Q_BLOCK, strict priority serves it first and Q_RESP is</text><text x='80' y='298' class='s'>starved — so the response is held. The response is enqueued ONCE; it does not recirculate.</text></svg>