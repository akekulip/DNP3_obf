<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 680 340' width='680' height='340'><style>text{fill:#111} .t{font-family='Helvetica,Arial,sans-serif';font-size:13px} .h{font-family='Helvetica,Arial,sans-serif';font-size:16px;font-weight:bold}.s{font-family='Helvetica,Arial,sans-serif';font-size:11px;fill:#555} .box{fill:#f4f6f8;stroke:#345;stroke-width:1.5}.hi{fill:#e8f5e9;stroke:#2ca02c;stroke-width:1.5} .blk{fill:#fdecea;stroke:#d62728;stroke-width:1.5}.acc{fill:#e7effa;stroke:#1f77b4;stroke-width:1.5} .ln{stroke:#345;stroke-width:1.5;fill:none}.dsh{stroke:#888;stroke-width:1.2;stroke-dasharray:5 4;fill:none}@media(prefers-color-scheme:dark){text{fill:#e8e8e8}.s{fill:#aaa}.box{fill:#20272e;stroke:#7a9cc6}.hi{fill:#16321c;stroke:#4caf7d}.blk{fill:#3a1d1d;stroke:#e06666}.acc{fill:#1b2a3d;stroke:#6fa8dc}.ln{stroke:#9ab}.dsh{stroke:#999}}</style><defs><marker id='a' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto'><path d='M0,0 L9,3 L0,6 Z' fill='#345'/></marker><marker id='ag' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto'><path d='M0,0 L9,3 L0,6 Z' fill='#2ca02c'/></marker></defs><text x='20' y='30' class='h'>Diagram 7 — G-selection guard</text><rect x='60' y='70' width='300' height='50' rx='6' class='acc'/><text x='210' y='100' text-anchor='middle' class='t'>measure native_clrt = t_resp − t_ack</text><rect x='60' y='160' width='300' height='50' rx='6' class='box'/><text x='210' y='190' text-anchor='middle' class='t'>compare native_clrt vs policy G</text><path d='M210,120 L210,158' class='ln' marker-end='url(#a)'/><rect x='430' y='130' width='200' height='46' rx='6' class='hi'/><text x='530' y='150' text-anchor='middle' class='t'>native_clrt &lt; G</text><text x='530' y='166' text-anchor='middle' class='s'>protection applied (held)</text><rect x='430' y='220' width='200' height='46' rx='6' class='blk'/><text x='530' y='240' text-anchor='middle' class='t'>native_clrt ≥ G</text><text x='530' y='256' text-anchor='middle' class='s'>zero-hold — LOW-G WARNING</text><path d='M360,175 L428,153' class='ln' marker-end='url(#ag)'/><text x='394' y='160' text-anchor='middle' class='s'>sign bit set</text><path d='M360,195 L428,240' class='ln' marker-end='url(#a)'/><text x='394' y='213' text-anchor='middle' class='s'>sign bit clear</text><text x='60' y='300' class='s'>Set G above the p99 native CLRT of the slowest device in the anonymity set.</text><text x='60' y='318' class='s'>On the SEL-751 (native p99 ≈ 11.4 ms) we used G = 25 ms; G = 1 ms flags every txn zero-hold.</text></svg>