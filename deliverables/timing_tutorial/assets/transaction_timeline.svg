<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 320' width='820' height='320'><style>text{fill:#111} .t{font-family='Helvetica,Arial,sans-serif';font-size:13px} .h{font-family='Helvetica,Arial,sans-serif';font-size:16px;font-weight:bold}.s{font-family='Helvetica,Arial,sans-serif';font-size:11px;fill:#555} .box{fill:#f4f6f8;stroke:#345;stroke-width:1.5}.hi{fill:#e8f5e9;stroke:#2ca02c;stroke-width:1.5} .blk{fill:#fdecea;stroke:#d62728;stroke-width:1.5}.acc{fill:#e7effa;stroke:#1f77b4;stroke-width:1.5} .ln{stroke:#345;stroke-width:1.5;fill:none}.dsh{stroke:#888;stroke-width:1.2;stroke-dasharray:5 4;fill:none}@media(prefers-color-scheme:dark){text{fill:#e8e8e8}.s{fill:#aaa}.box{fill:#20272e;stroke:#7a9cc6}.hi{fill:#16321c;stroke:#4caf7d}.blk{fill:#3a1d1d;stroke:#e06666}.acc{fill:#1b2a3d;stroke:#6fa8dc}.ln{stroke:#9ab}.dsh{stroke:#999}}</style><defs><marker id='a' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto'><path d='M0,0 L9,3 L0,6 Z' fill='#345'/></marker><marker id='ag' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto'><path d='M0,0 L9,3 L0,6 Z' fill='#2ca02c'/></marker></defs><text x='20' y='30' class='h'>Diagram 4 — Transaction timeline</text><text x='20' y='70' class='t'>A. native RESPONSE before deadline — protection applied</text><line x1='60' y1='120' x2='780' y2='120' class='ln'/><line x1='74' y1='112' x2='74' y2='128' class='ln'/><text x='74' y='100' text-anchor='middle' class='s' fill='#345'>READ</text><line x1='161' y1='112' x2='161' y2='128' class='ln'/><text x='161' y='100' text-anchor='middle' class='s' fill='#345'>ACK</text><text x='161' y='88' text-anchor='middle' class='s' fill='#345'>(t_ack)</text><line x1='204' y1='112' x2='204' y2='128' class='ln'/><text x='204' y='100' text-anchor='middle' class='s' fill='#345'>native RESP</text><text x='204' y='88' text-anchor='middle' class='s' fill='#345'>arrives</text><line x1='636' y1='112' x2='636' y2='128' class='ln'/><text x='636' y='145' text-anchor='middle' class='s' fill='#2ca02c'>deadline</text><text x='636' y='157' text-anchor='middle' class='s' fill='#2ca02c'>t_ack+G</text><line x1='658' y1='112' x2='658' y2='128' class='ln'/><text x='658' y='145' text-anchor='middle' class='s' fill='#2ca02c'>release</text><text x='658' y='157' text-anchor='middle' class='s' fill='#2ca02c'>(+~1.7µs tail)</text><rect x='204' y='115' width='432' height='10' class='hi'/><text x='420' y='123' text-anchor='middle' class='s'>effective hold</text><text x='20' y='210' class='t'>B. native RESPONSE after deadline — zero hold, low-G warning</text><line x1='60' y1='260' x2='780' y2='260' class='ln'/><line x1='74' y1='252' x2='74' y2='268' class='ln'/><text x='74' y='240' text-anchor='middle' class='s' fill='#345'>READ</text><line x1='132' y1='252' x2='132' y2='268' class='ln'/><text x='132' y='240' text-anchor='middle' class='s' fill='#345'>ACK</text><line x1='276' y1='252' x2='276' y2='268' class='ln'/><text x='276' y='240' text-anchor='middle' class='s' fill='#d62728'>deadline</text><text x='276' y='228' text-anchor='middle' class='s' fill='#d62728'>t_ack+G (small)</text><line x1='456' y1='252' x2='456' y2='268' class='ln'/><text x='456' y='285' text-anchor='middle' class='s' fill='#d62728'>native RESP</text><text x='456' y='297' text-anchor='middle' class='s' fill='#d62728'>arrives late</text><text x='420' y='263' text-anchor='middle' class='s' fill='#d62728'>G below native CLRT ⇒ nothing to hold</text></svg>