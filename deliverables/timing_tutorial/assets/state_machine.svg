<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 340' width='820' height='340'><style>text{fill:#111} .t{font-family='Helvetica,Arial,sans-serif';font-size:13px} .h{font-family='Helvetica,Arial,sans-serif';font-size:16px;font-weight:bold}.s{font-family='Helvetica,Arial,sans-serif';font-size:11px;fill:#555} .box{fill:#f4f6f8;stroke:#345;stroke-width:1.5}.hi{fill:#e8f5e9;stroke:#2ca02c;stroke-width:1.5} .blk{fill:#fdecea;stroke:#d62728;stroke-width:1.5}.acc{fill:#e7effa;stroke:#1f77b4;stroke-width:1.5} .ln{stroke:#345;stroke-width:1.5;fill:none}.dsh{stroke:#888;stroke-width:1.2;stroke-dasharray:5 4;fill:none}@media(prefers-color-scheme:dark){text{fill:#e8e8e8}.s{fill:#aaa}.box{fill:#20272e;stroke:#7a9cc6}.hi{fill:#16321c;stroke:#4caf7d}.blk{fill:#3a1d1d;stroke:#e06666}.acc{fill:#1b2a3d;stroke:#6fa8dc}.ln{stroke:#9ab}.dsh{stroke:#999}}</style><defs><marker id='a' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto'><path d='M0,0 L9,3 L0,6 Z' fill='#345'/></marker><marker id='ag' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto'><path d='M0,0 L9,3 L0,6 Z' fill='#2ca02c'/></marker></defs><text x='20' y='30' class='h'>Diagram 5 — Transaction state machine</text><rect x='60' y='70' width='150' height='46' rx='6' class='box'/><text x='135' y='98' text-anchor='middle' class='t'>IDLE</text><rect x='250' y='70' width='150' height='46' rx='6' class='box'/><text x='325' y='98' text-anchor='middle' class='t'>ARMED</text><rect x='450' y='70' width='150' height='46' rx='6' class='acc'/><text x='525' y='98' text-anchor='middle' class='t'>ACK_QUALIFIED</text><rect x='450' y='180' width='150' height='46' rx='6' class='hi'/><text x='525' y='208' text-anchor='middle' class='t'>RESPONSE_HELD</text><rect x='250' y='180' width='150' height='46' rx='6' class='hi'/><text x='325' y='208' text-anchor='middle' class='t'>DEADLINE_RELEASE</text><rect x='60' y='180' width='150' height='46' rx='6' class='blk'/><text x='135' y='208' text-anchor='middle' class='t'>FAIL_OPEN</text><rect x='60' y='290' width='150' height='46' rx='6' class='box'/><text x='135' y='318' text-anchor='middle' class='t'>CLEANUP</text><path d='M210,93 L250,93' class='ln' marker-end='url(#a)'/><text x='230' y='89' text-anchor='middle' class='s'>READ</text><path d='M400,93 L450,93' class='ln' marker-end='url(#a)'/><text x='425' y='89' text-anchor='middle' class='s'>pure ACK</text><path d='M525,116 L525,178' class='ln' marker-end='url(#a)'/><text x='525' y='143' text-anchor='middle' class='s'>RESPONSE</text><path d='M450,203 L400,203' class='ln' marker-end='url(#a)'/><text x='425' y='199' text-anchor='middle' class='s'>deadline expires</text><path d='M250,203 L210,203' class='ln' marker-end='url(#a)'/><text x='230' y='199' text-anchor='middle' class='s'>budget=0</text><path d='M135,226 L135,288' class='ln' marker-end='url(#a)'/><text x='135' y='253' text-anchor='middle' class='s'>drop tokens</text><path d='M60,313 L28,313 L28,93 L58,93' class='dsh' fill='none' marker-end='url(#a)'/><text x='34' y='205' class='s'>→ IDLE</text><text x='560' y='300' class='s'>Stale / unrelated / retransmitted packets take bypass paths</text><text x='560' y='316' class='s'>(to_fwd) and do NOT change transaction state.</text></svg>