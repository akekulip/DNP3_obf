<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 860 571' width='860' height='571'><style>text{fill:#111} .t{font-family='Helvetica,Arial,sans-serif';font-size:13px} .h{font-family='Helvetica,Arial,sans-serif';font-size:16px;font-weight:bold}.s{font-family='Helvetica,Arial,sans-serif';font-size:11px;fill:#555} .box{fill:#f4f6f8;stroke:#345;stroke-width:1.5}.hi{fill:#e8f5e9;stroke:#2ca02c;stroke-width:1.5} .blk{fill:#fdecea;stroke:#d62728;stroke-width:1.5}.acc{fill:#e7effa;stroke:#1f77b4;stroke-width:1.5} .ln{stroke:#345;stroke-width:1.5;fill:none}.dsh{stroke:#888;stroke-width:1.2;stroke-dasharray:5 4;fill:none}@media(prefers-color-scheme:dark){text{fill:#e8e8e8}.s{fill:#aaa}.box{fill:#20272e;stroke:#7a9cc6}.hi{fill:#16321c;stroke:#4caf7d}.blk{fill:#3a1d1d;stroke:#e06666}.acc{fill:#1b2a3d;stroke:#6fa8dc}.ln{stroke:#9ab}.dsh{stroke:#999}}</style><defs><marker id='a' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto'><path d='M0,0 L9,3 L0,6 Z' fill='#345'/></marker><marker id='ag' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto'><path d='M0,0 L9,3 L0,6 Z' fill='#2ca02c'/></marker></defs><text x='20' y='30' class='h'>Diagram 2 — Packet path</text><rect x='230' y='55' width='400' height='34' rx='6' class='box'/><text x='430' y='77' text-anchor='middle' class='t'>READ arrives</text><path d='M430,89 L430,101' class='ln' marker-end='url(#a)'/><rect x='230' y='101' width='400' height='34' rx='6' class='box'/><text x='430' y='123' text-anchor='middle' class='t'>transaction state armed</text><path d='M430,135 L430,147' class='ln' marker-end='url(#a)'/><rect x='230' y='147' width='400' height='34' rx='6' class='box'/><text x='430' y='169' text-anchor='middle' class='t'>pure ACK arrives</text><path d='M430,181 L430,193' class='ln' marker-end='url(#a)'/><rect x='230' y='193' width='400' height='34' rx='6' class='box'/><text x='430' y='215' text-anchor='middle' class='t'>t_ack recorded</text><path d='M430,227 L430,239' class='ln' marker-end='url(#a)'/><rect x='230' y='239' width='400' height='34' rx='6' class='box'/><text x='430' y='261' text-anchor='middle' class='t'>deadline = t_ack + G</text><path d='M430,273 L430,285' class='ln' marker-end='url(#a)'/><rect x='230' y='285' width='400' height='34' rx='6' class='box'/><text x='430' y='307' text-anchor='middle' class='t'>RESPONSE arrives</text><path d='M430,319 L430,331' class='ln' marker-end='url(#a)'/><rect x='230' y='331' width='400' height='34' rx='6' class='box'/><text x='430' y='353' text-anchor='middle' class='t'>RESPONSE enters Q_RESP</text><path d='M430,365 L430,377' class='ln' marker-end='url(#a)'/><rect x='230' y='377' width='400' height='34' rx='6' class='blk'/><text x='430' y='399' text-anchor='middle' class='t'>blocker reservoir keeps Q_RESP from draining</text><path d='M430,411 L430,423' class='ln' marker-end='url(#a)'/><rect x='230' y='423' width='400' height='34' rx='6' class='box'/><text x='430' y='445' text-anchor='middle' class='t'>deadline expires</text><path d='M430,457 L430,469' class='ln' marker-end='url(#a)'/><rect x='230' y='469' width='400' height='34' rx='6' class='blk'/><text x='430' y='491' text-anchor='middle' class='t'>blockers terminate</text><path d='M430,503 L430,515' class='ln' marker-end='url(#a)'/><rect x='230' y='515' width='400' height='34' rx='6' class='hi'/><text x='430' y='537' text-anchor='middle' class='t'>RESPONSE exits unchanged</text></svg>