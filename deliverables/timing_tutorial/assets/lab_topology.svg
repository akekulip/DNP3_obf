<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 860 320' width='860' height='320'><style>text{fill:#111} .t{font-family='Helvetica,Arial,sans-serif';font-size:13px} .h{font-family='Helvetica,Arial,sans-serif';font-size:16px;font-weight:bold}.s{font-family='Helvetica,Arial,sans-serif';font-size:11px;fill:#555} .box{fill:#f4f6f8;stroke:#345;stroke-width:1.5}.hi{fill:#e8f5e9;stroke:#2ca02c;stroke-width:1.5} .blk{fill:#fdecea;stroke:#d62728;stroke-width:1.5}.acc{fill:#e7effa;stroke:#1f77b4;stroke-width:1.5} .ln{stroke:#345;stroke-width:1.5;fill:none}.dsh{stroke:#888;stroke-width:1.2;stroke-dasharray:5 4;fill:none}@media(prefers-color-scheme:dark){text{fill:#e8e8e8}.s{fill:#aaa}.box{fill:#20272e;stroke:#7a9cc6}.hi{fill:#16321c;stroke:#4caf7d}.blk{fill:#3a1d1d;stroke:#e06666}.acc{fill:#1b2a3d;stroke:#6fa8dc}.ln{stroke:#9ab}.dsh{stroke:#999}}</style><defs><marker id='a' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto'><path d='M0,0 L9,3 L0,6 Z' fill='#345'/></marker><marker id='ag' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto'><path d='M0,0 L9,3 L0,6 Z' fill='#2ca02c'/></marker></defs><text x='20' y='30' class='h'>Diagram 1 — Laboratory topology</text><rect x='60' y='60' width='200' height='70' rx='6' class='box'/><text x='160' y='92' text-anchor='middle' class='t'>Vision / master</text><text x='160' y='108' text-anchor='middle' class='s'>10.10.54.19 mgmt · 192.168.10.1 relay-net</text><rect x='340' y='60' width='200' height='70' rx='6' class='acc'/><text x='440' y='92' text-anchor='middle' class='t'>Tofino-1 switch</text><text x='440' y='108' text-anchor='middle' class='s'>10.10.54.81</text><rect x='620' y='60' width='200' height='70' rx='6' class='box'/><text x='720' y='92' text-anchor='middle' class='t'>Hulk / outstation-side</text><text x='720' y='108' text-anchor='middle' class='s'>10.10.54.158</text><rect x='340' y='210' width='200' height='56' rx='6' class='hi'/><text x='440' y='235' text-anchor='middle' class='t'>dp8 internal</text><text x='440' y='251' text-anchor='middle' class='t'>MAC-near loopback</text><text x='299' y='132' text-anchor='middle' class='s'>dp9</text><text x='579' y='132' text-anchor='middle' class='s'>dp11</text><path d='M260,85 L338,85' class='ln' marker-end='url(#a)'/><text x='299' y='81' text-anchor='middle' class='s'>READ →</text><path d='M338,110 L260,110' class='ln' marker-end='url(#a)'/><text x='299' y='106' text-anchor='middle' class='s'>← ACK, RESPONSE</text><path d='M540,85 L618,85' class='ln' marker-end='url(#a)'/><path d='M618,110 L540,110' class='ln' marker-end='url(#a)'/><path d='M440,130 L440,208' class='dsh' marker-end='url(#ag)'/><text x='440' y='165' text-anchor='middle' class='s'>blocker-token loop</text><path d='M415,208 L415,132' class='dsh' marker-end='url(#ag)'/><rect x='590' y='210' width='230' height='56' rx='6' class='box'/><text x='705' y='235' text-anchor='middle' class='t'>SEL-751 relay</text><text x='705' y='251' text-anchor='middle' class='s'>192.168.10.7:20000 (READ-only)</text><path d='M700,130 L700,208' class='dsh' marker-end='url(#a)'/><text x='60' y='300' class='s'>Blocker tokens (EtherType 0x88c1) recirculate on dp8 only — they never egress to a host.</text></svg>