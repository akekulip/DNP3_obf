claims:
  - claim: "the safety paths compile unconditionally; a no-flag build is the safe program"
    evidence: "empty bf-p4c -E token diff vs the flagged build (agent-verified); 9.13.2 compile"
    verdict: verified
  - claim: "the fail-open note predicate is present in the compiled assembly"
    analyzer: "analysis/assert_salu_asm.py --require-r2 artifacts/final/final_core_sde9132.bfa"
    verdict: pass
  - claim: "the parser assigns every classification field; no uninitialized_out_param (REPORT §8.6)"
    evidence: "0 uninitialized_out_param across all four 9.13.2 builds; evidence/final_silicon/"
    verdict: verified
  - claim: "TCP sequence tracking is full-width via a writer/reader split; seq 0 is stored (REPORT §8.5)"
    evidence: "assembly exp_seq_w unconditional store; 9.13.2 resource-neutral; Gate 2 PASS"
    verdict: verified
  - claim: "safety-path objects present; parameter policy admits D=2; reg_failopen clean"
    analyzer: "setup --config on the loaded synthetic build (43/43 PASS)"
    evidence: evidence/final_silicon/
    verdict: pass
  - claim: "Gate 2 lifecycle passes on the canonical build on silicon"
    analyzer: "run_defense3.sh --gate2 -> analysis/analyze_defense3.py"
    evidence: evidence/gate2/     # a canonical-build gate2_* directory, 1 PASS / 0 FAIL
    verdict: pass
  - claim: "physical SEL-751 campaigns (three sessions, same relay; REPORT §11.5)"
    evidence: evidence/physical/, evidence/physical_repaired/
    verdict: pass
  - claim: "state-machine model correctness (checked, not exhaustively proven)"
    analyzer: "analysis/test_tag_domain.py"   # 2674 assertions, mutation-checked
    verdict: pass
  - claim: "hold-continuity floor is K=44, identical at D=2/8/16 ms (REPORT §7.5)"
    analyzer: "analysis/analyze_ksweep_hold.py"
    evidence: evidence/ksweep_hold/20260803T175912Z/   # 96 in-chip transactions, 3 reps/point
    verdict: pass

