# Defense 3 — release manifest (see archive/audit/ORIGINAL_AUDIT.md §9)
# Binds the major claims to the exact source, compiler, flags, artifacts, evidence and
# analyzers that establish them. SHA-256s are of the files as committed.
# VERIFY / REFRESH:  python3 analysis/verify_manifest.py [--write]
#   --check (default) fails if any recorded hash no longer matches its file;
#   --write rewrites the hashes and `commit` from the current files.
# `commit` is the tree state these hashes describe; this manifest is committed immediately
# after, so HEAD is normally one commit ahead of the value below.

