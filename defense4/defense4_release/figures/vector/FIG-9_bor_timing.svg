<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="fig9-title fig9-desc" font-family="Helvetica, Arial, sans-serif">
  <title id="fig9-title">BOR hold/release timing and anti-subtraction on the master-facing observable</title>
  <desc id="fig9-desc">A two-track timeline anchored at OPERATE arrival T0: the switch holds the OPERATE and releases it to the relay at T0 plus J (J drawn from a hidden codebook), while the master-facing observable shows the ACK at T0 plus A (about 20 ms) and the echo, carved to segments 28 and 21 bytes, at T0 plus R (about 24 ms); the echo-minus-ACK interval equals R minus A, about 4 ms, and stays constant as J varies over 2, 6 and 12 ms, so J is not observable to the master.</desc>
  <defs>
    <marker id="a9" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="a9c" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c0552b"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- header -->
  <text x="40" y="44" fill="#7a8399" font-size="11" letter-spacing="0.16em" font-family="monospace">BOR HOLD / RELEASE · MASTER-FACING OBSERVABLE · N=30/J · SEL-751</text>
  <text x="40" y="72" fill="#2d3142" font-size="24" font-family="Georgia, 'Times New Roman', serif">OPERATE held to T0+J; ACK/echo pinned to T0+A, T0+R</text>

  <!-- time axis geometry: T0=120px, 1ms = 30px, axis at x 120..900 -->
  <!-- vertical anchor guides -->
  <line x1="120" y1="120" x2="120" y2="452" stroke="#2d3142" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="480" y1="120" x2="480" y2="452" stroke="#7a8399" stroke-opacity="0.30" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="720" y1="120" x2="720" y2="452" stroke="#c0552b" stroke-opacity="0.45" stroke-width="1"/>
  <line x1="840" y1="120" x2="840" y2="452" stroke="#c0552b" stroke-opacity="0.45" stroke-width="1"/>
  <!-- anchor captions -->
  <text x="120" y="112" fill="#2d3142" font-size="10" font-family="monospace" text-anchor="middle" font-weight="600">T0</text>
  <text x="480" y="112" fill="#7a8399" font-size="10" font-family="monospace" text-anchor="middle">T0+J</text>
  <text x="720" y="112" fill="#c0552b" font-size="10" font-family="monospace" text-anchor="middle" font-weight="600">T0+A ≈ 20 ms</text>
  <text x="840" y="112" fill="#c0552b" font-size="10" font-family="monospace" text-anchor="middle" font-weight="600">T0+R ≈ 24 ms</text>

  <!-- ================= relay-facing (internal) track ================= -->
  <text x="40" y="196" fill="#7a8399" font-size="8" font-family="monospace" letter-spacing="0.12em">RELAY-FACING (INTERNAL, dp10 BOR hold)</text>
  <line x1="120" y1="220" x2="900" y2="220" stroke="#4f5d75" stroke-opacity="0.5" stroke-width="1"/>
  <!-- hold span T0..T0+J -->
  <rect x="120" y="212" width="360" height="16" rx="3" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-opacity="0.5" stroke-dasharray="4,3"/>
  <rect x="250" y="200" width="108" height="12" rx="2" fill="#f5f5f5"/><text x="304" y="209" fill="#4f5d75" font-size="8" font-family="monospace" text-anchor="middle">HELD in qid2</text>
  <!-- release marker at T0+J -->
  <circle cx="480" cy="220" r="4" fill="#7a8399"/>
  <rect x="424" y="232" width="150" height="12" rx="2" fill="#f5f5f5"/><text x="499" y="241" fill="#4f5d75" font-size="8" font-family="monospace" text-anchor="middle">OPERATE released → dp64</text>
  <!-- J is hidden note -->
  <rect x="300" y="248" width="150" height="14" rx="2" fill="#f5f5f5"/><text x="375" y="258" fill="#7a8399" font-size="8" font-family="monospace" text-anchor="middle" font-style="italic">J ∈ {2,6,12} — hidden</text>

  <!-- ================= master-facing (observable) track ================= -->
  <text x="40" y="322" fill="#7a8399" font-size="8" font-family="monospace" letter-spacing="0.12em">MASTER-FACING (OBSERVABLE)</text>
  <line x1="120" y1="346" x2="900" y2="346" stroke="#4f5d75" stroke-opacity="0.5" stroke-width="1"/>
  <!-- OPERATE sent at T0 -->
  <circle cx="120" cy="346" r="4" fill="#2d3142"/>
  <rect x="94" y="358" width="120" height="12" rx="2" fill="#f5f5f5"/><text x="154" y="367" fill="#4f5d75" font-size="8" font-family="monospace" text-anchor="middle">OPERATE sent (T0)</text>
  <!-- ACK at T0+A -->
  <circle cx="720" cy="346" r="4" fill="#c0552b"/>
  <rect x="676" y="326" width="88" height="12" rx="2" fill="#f5f5f5"/><text x="720" y="335" fill="#c0552b" font-size="8" font-family="monospace" text-anchor="middle">ACK 20.5 ms</text>
  <!-- echo at T0+R -->
  <circle cx="840" cy="346" r="4" fill="#c0552b"/>
  <rect x="792" y="326" width="140" height="12" rx="2" fill="#f5f5f5"/><text x="862" y="335" fill="#c0552b" font-size="8" font-family="monospace" text-anchor="middle">echo [28,21] 24.5 ms</text>
  <!-- echo-ACK bracket -->
  <path d="M720 362 V376 H840 V362" stroke="#c0552b" stroke-width="1" fill="none"/>
  <rect x="716" y="382" width="128" height="14" rx="2" fill="#f5f5f5"/><text x="780" y="392" fill="#c0552b" font-size="9" font-family="monospace" text-anchor="middle" font-weight="600">echo−ACK = R−A ≈ 4.00 ms</text>

  <!-- invariance panel -->
  <rect x="120" y="420" width="780" height="40" rx="6" fill="#c0552b" fill-opacity="0.06" stroke="#c0552b" stroke-opacity="0.5"/>
  <text x="510" y="438" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle">Anti-subtraction: A, R and echo−ACK are invariant to J</text>
  <text x="510" y="452" fill="#4f5d75" font-size="9" font-family="monospace" text-anchor="middle">J=2: A 21.03 R 25.03 · J=6: A 21.02 R 25.03 · J=12: A 21.02 R 25.02 · echo−ACK std 0.027 ms · TCP timestamps off</text>

  <!-- legend -->
  <line x1="40" y1="486" x2="960" y2="486" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
  <text x="40" y="504" fill="#4f5d75" font-size="8" font-family="monospace" letter-spacing="0.14em">LEGEND</text>
  <circle cx="128" cy="501" r="4" fill="#2d3142"/><text x="140" y="504" fill="#4f5d75" font-size="9" font-family="monospace">T0 / send</text>
  <circle cx="260" cy="501" r="4" fill="#7a8399"/><text x="272" y="504" fill="#4f5d75" font-size="9" font-family="monospace">internal release T0+J (hidden)</text>
  <circle cx="560" cy="501" r="4" fill="#c0552b"/><text x="572" y="504" fill="#4f5d75" font-size="9" font-family="monospace">master-facing ACK / echo (policy-pinned)</text>
</svg>
