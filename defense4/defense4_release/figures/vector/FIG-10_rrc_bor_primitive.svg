<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" role="img" aria-labelledby="fig10-title fig10-desc" font-family="Helvetica, Arial, sans-serif">
  <title id="fig10-title">The RRC and BOR primitives — mechanism</title>
  <desc id="fig10-desc">Two process panels. RRC (size and CLRT primitive for READ and SELECT): the relay's native response with a separate ACK is recirculated through the dp8 loopback, carved only at DNP3 CRC block boundaries into 28 and 21 byte segments without modifying bytes or recomputing CRCs, and held to a fixed CLRT deadline, so the master sees a fixed segmentation and CLRT. BOR (bounded OPERATE release for Select-Before-Operate): the SELECT pre-seeds a BOR epoch reservoir on dp10, the OPERATE arriving at T0 is held in queue qid2 and released exactly once to the relay at T0 plus J from a secret codebook, and the relay ACK and echo are released to the master at T0 plus A and T0 plus R anchored to T0 so that echo minus ACK equals R minus A and stays invariant as J varies.</desc>
  <defs>
    <marker id="p" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="pc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c0552b"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="40" y="44" fill="#7a8399" font-size="11" letter-spacing="0.16em" font-family="monospace">IN-SWITCH PRIMITIVES · BYTE-PRESERVING · CASE-A SEPARATE-ACK (SEL-751)</text>
  <text x="40" y="72" fill="#2d3142" font-size="24" font-family="Georgia, 'Times New Roman', serif">The RRC and BOR primitives</text>

  <!-- ===== RRC panel ===== -->
  <text x="40" y="120" fill="#c0552b" font-size="10" font-family="monospace" letter-spacing="0.12em">RRC — SIZE + CLRT PRIMITIVE  (READ / SELECT)</text>
  <!-- connectors -->
  <path d="M212 176 H248" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#p)"/>
  <path d="M420 176 H456" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#p)"/>
  <path d="M628 176 H664" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#p)"/>
  <path d="M836 176 H872" stroke="#c0552b" stroke-width="1.2" fill="none" marker-end="url(#pc)"/>
  <!-- steps -->
  <g font-family="monospace">
    <rect x="40" y="148" width="172" height="56" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399"/><text x="126" y="172" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle" font-family="Helvetica">relay response</text><text x="126" y="188" fill="#4f5d75" font-size="8.5" text-anchor="middle">49 B + separate ACK</text>
    <rect x="248" y="148" width="172" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="334" y="172" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle" font-family="Helvetica">recirculate</text><text x="334" y="188" fill="#4f5d75" font-size="8.5" text-anchor="middle">via dp8 loopback</text>
    <rect x="456" y="148" width="172" height="56" rx="6" fill="#c0552b" fill-opacity="0.06" stroke="#c0552b"/><text x="542" y="170" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle" font-family="Helvetica">carve at CRC</text><text x="542" y="184" fill="#4f5d75" font-size="8.5" text-anchor="middle">→ [28,21] byte-preserving</text><text x="542" y="196" fill="#7a8399" font-size="8" text-anchor="middle">no recompute</text>
    <rect x="664" y="148" width="172" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="750" y="172" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle" font-family="Helvetica">hold to CLRT</text><text x="750" y="188" fill="#4f5d75" font-size="8.5" text-anchor="middle">fixed deadline (qid6/qid4)</text>
    <rect x="872" y="148" width="128" height="56" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399"/><text x="936" y="172" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle" font-family="Helvetica">master</text><text x="936" y="188" fill="#4f5d75" font-size="8.5" text-anchor="middle">[28,21] · CLRT=policy</text>
  </g>
  <text x="40" y="232" fill="#7a8399" font-size="9" font-family="monospace">Result: native [49] → [28,21] (1280/1280 CRC-valid, 0 escapes); CLRT 1.27/2.11 ms (var) → 4.001 ms (std 0.02).</text>

  <line x1="40" y1="264" x2="1000" y2="264" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>

  <!-- ===== BOR panel ===== -->
  <text x="40" y="304" fill="#c0552b" font-size="10" font-family="monospace" letter-spacing="0.12em">BOR — BOUNDED OPERATE RELEASE  (SBO)</text>
  <!-- forward flow -->
  <path d="M212 360 H248" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#p)"/>
  <path d="M420 360 H456" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#p)"/>
  <path d="M628 360 H664" stroke="#c0552b" stroke-width="1.2" fill="none" marker-end="url(#pc)"/>
  <g font-family="monospace">
    <rect x="40" y="332" width="172" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/><text x="126" y="356" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle" font-family="Helvetica">SELECT</text><text x="126" y="372" fill="#4f5d75" font-size="8.5" text-anchor="middle">pre-seeds BOR epoch (qid3)</text>
    <rect x="248" y="332" width="172" height="56" rx="6" fill="#c0552b" fill-opacity="0.06" stroke="#c0552b"/><text x="334" y="356" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle" font-family="Helvetica">OPERATE @ T0</text><text x="334" y="372" fill="#4f5d75" font-size="8.5" text-anchor="middle">held in qid2 (dp10)</text>
    <rect x="456" y="332" width="172" height="56" rx="6" fill="#c0552b" fill-opacity="0.06" stroke="#c0552b"/><text x="542" y="356" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle" font-family="Helvetica">release once</text><text x="542" y="372" fill="#4f5d75" font-size="8.5" text-anchor="middle">@ T0+J (secret codebook)</text>
    <rect x="664" y="332" width="140" height="56" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399"/><text x="734" y="356" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle" font-family="Helvetica">relay (dp64)</text><text x="734" y="372" fill="#4f5d75" font-size="8.5" text-anchor="middle">exactly-once OPERATE</text>
  </g>
  <!-- return flow to master -->
  <path d="M734 388 V420 H126 V420" stroke="#7a8399" stroke-width="1" fill="none"/>
  <path d="M126 420 V444" stroke="#c0552b" stroke-width="1.2" fill="none" marker-end="url(#pc)"/>
  <rect x="470" y="412" width="180" height="14" rx="2" fill="#f5f5f5"/><text x="560" y="422" fill="#7a8399" font-size="8" font-family="monospace" text-anchor="middle">relay ACK + echo return</text>
  <g font-family="monospace">
    <rect x="40" y="452" width="230" height="52" rx="6" fill="#c0552b" fill-opacity="0.06" stroke="#c0552b"/><text x="155" y="474" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle" font-family="Helvetica">master-facing (observable)</text><text x="155" y="490" fill="#4f5d75" font-size="8.5" text-anchor="middle">ACK @ T0+A · echo [28,21] @ T0+R</text>
    <rect x="310" y="452" width="690" height="52" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.25"/><text x="655" y="474" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle" font-family="Helvetica">Anti-subtraction: echo−ACK = R−A, invariant to J</text><text x="655" y="490" fill="#4f5d75" font-size="8.5" text-anchor="middle">J∈{2,6,12} hidden · echo−ACK 4.00 ms std 0.027 · TCP timestamps off · relay-facing T0+J not captured</text>
  </g>

  <!-- legend -->
  <line x1="40" y1="546" x2="1000" y2="546" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
  <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="558" width="12" height="10" rx="2" fill="#c0552b" fill-opacity="0.06" stroke="#c0552b"/><text x="138" y="566" fill="#4f5d75" font-size="9" font-family="monospace">defense step (RRC/BOR)</text>
  <rect x="330" y="558" width="12" height="10" rx="2" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399"/><text x="348" y="566" fill="#4f5d75" font-size="9" font-family="monospace">endpoint (master / relay)</text>
  <line x1="560" y1="563" x2="588" y2="563" stroke="#c0552b" stroke-width="1.2"/><text x="594" y="566" fill="#4f5d75" font-size="9" font-family="monospace">policy-governed release</text>
</svg>
