<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 240" role="img" aria-labelledby="fig0-t fig0-d" font-family="Helvetica, Arial, sans-serif">
  <title id="fig0-t">Defense 4 high-level packet path</title>
  <desc id="fig0-d">Left to right: DNP3 traffic enters, the switch classifies the transaction (READ, SELECT or OPERATE), applies a timing policy, steers the packet into the RRC or BOR egress queues, splits the response at a DNP3 CRC boundary, and emits master-visible normalized traffic.</desc>
  <defs>
    <marker id="o" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#4f5d75"/></marker>
    <marker id="oc" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#c0552b"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="40" y="40" fill="#7a8399" font-size="11" letter-spacing="0.16em" font-family="monospace">DEFENSE 4 · HIGH-LEVEL PACKET PATH (ONE TOFINO-1, INLINE)</text>
  <!-- arrows behind -->
  <g>
    <path d="M212 128 H250" stroke="#4f5d75" stroke-width="1.1" fill="none" marker-end="url(#o)"/>
    <path d="M410 128 H448" stroke="#4f5d75" stroke-width="1.1" fill="none" marker-end="url(#o)"/>
    <path d="M608 128 H646" stroke="#4f5d75" stroke-width="1.1" fill="none" marker-end="url(#o)"/>
    <path d="M806 128 H844" stroke="#c0552b" stroke-width="1.3" fill="none" marker-end="url(#oc)"/>
    <path d="M1004 128 H1042" stroke="#c0552b" stroke-width="1.3" fill="none" marker-end="url(#oc)"/>
  </g>
  <g font-family="Helvetica">
    <rect x="40" y="100" width="172" height="56" rx="7" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399"/><text x="126" y="126" fill="#2d3142" font-size="12.5" font-weight="600" text-anchor="middle">DNP3 traffic</text><text x="126" y="143" fill="#7a8399" font-size="8.5" text-anchor="middle" font-family="monospace">master &#8596; SEL-751</text>
    <rect x="250" y="100" width="160" height="56" rx="7" fill="#ffffff" stroke="#2d3142"/><text x="330" y="123" fill="#2d3142" font-size="12.5" font-weight="600" text-anchor="middle">Classify</text><text x="330" y="140" fill="#7a8399" font-size="8.5" text-anchor="middle" font-family="monospace">READ/SELECT/OPERATE</text>
    <rect x="448" y="100" width="160" height="56" rx="7" fill="#ffffff" stroke="#2d3142"/><text x="528" y="123" fill="#2d3142" font-size="12.5" font-weight="600" text-anchor="middle">Timing policy</text><text x="528" y="140" fill="#7a8399" font-size="8.5" text-anchor="middle" font-family="monospace">D_A, D_R, J</text>
    <rect x="646" y="100" width="160" height="56" rx="7" fill="#c0552b" fill-opacity="0.06" stroke="#c0552b"/><text x="726" y="123" fill="#2d3142" font-size="12.5" font-weight="600" text-anchor="middle">RRC / BOR queues</text><text x="726" y="140" fill="#7a8399" font-size="8.5" text-anchor="middle" font-family="monospace">dp8 · dp10 strict-prio</text>
    <rect x="844" y="100" width="160" height="56" rx="7" fill="#c0552b" fill-opacity="0.06" stroke="#c0552b"/><text x="924" y="123" fill="#2d3142" font-size="12.5" font-weight="600" text-anchor="middle">CRC-boundary split</text><text x="924" y="140" fill="#7a8399" font-size="8.5" text-anchor="middle" font-family="monospace">[49] &#8594; [28,21]</text>
    <rect x="1042" y="100" width="138" height="56" rx="7" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399"/><text x="1111" y="120" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Normalized</text><text x="1111" y="135" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">traffic</text><text x="1111" y="149" fill="#7a8399" font-size="8" text-anchor="middle" font-family="monospace">master-visible</text>
  </g>
</svg>
