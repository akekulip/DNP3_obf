<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 780" role="img" aria-labelledby="fig8-title fig8-desc" font-family="Helvetica, Arial, sans-serif">
  <title id="fig8-title">Tofino-1 pipeline with Traffic-Manager queues for the unified RRC+BOR DNP3 defense</title>
  <desc id="fig8-desc">One Tofino-1 pipe: master on dp9 enters the parser and a 12-stage MAU with early packet-class dispatch into mutually-exclusive RRC, BOR and bypass paths and one tbl_commit terminal; the Traffic Manager holds two independent internal-loopback strict-priority scheduling domains, dp8 with queues qid7 ACK_BLOCK, qid6 ACK_HOLD, qid5 RESP_BLOCK, qid4 RESP_HOLD, and dp10 with qid3 OP_BLOCK, qid2 OP_HOLD; released traffic egresses to the SEL-751 on dp64, and dp68 is the internal pktgen and clone-mirror feeding the block reservoirs.</desc>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c0552b"/></marker>
    <marker id="ard" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="40" y="44" fill="#7a8399" font-size="11" letter-spacing="0.16em" font-family="monospace">TOFINO-1 · ONE PIPE · 12 INGRESS MAU STAGES · TM STRICT-PRIORITY QUEUES</text>
  <text x="40" y="72" fill="#2d3142" font-size="24" font-family="Georgia, 'Times New Roman', serif">Unified RRC + BOR pipeline and Traffic Manager</text>

  <!-- ingress/egress connectors -->
  <path d="M172 150 H208" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#ar)"/>
  <path d="M312 150 H356" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#ar)"/>
  <path d="M596 150 H656" stroke="#c0552b" stroke-width="1.4" fill="none" marker-end="url(#arc)"/>
  <path d="M804 150 H852" stroke="#c0552b" stroke-width="1.4" fill="none" marker-end="url(#arc)"/>
  <rect x="600" y="122" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="630" y="131" fill="#c0552b" font-size="8" font-family="monospace" text-anchor="middle">OUTCOME</text>
  <rect x="808" y="122" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="832" y="131" fill="#c0552b" font-size="8" font-family="monospace" text-anchor="middle">RELEASE</text>
  <path d="M436 214 V250 a8 8 0 0 0 -8 8 H360 V300" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#ar)"/>
  <rect x="366" y="248" width="112" height="12" rx="2" fill="#f5f5f5"/><text x="422" y="257" fill="#7a8399" font-size="8" font-family="monospace" text-anchor="middle">recirc to TM</text>

  <!-- pipeline nodes -->
  <rect x="40" y="124" width="132" height="52" rx="6" fill="#f5f5f5"/><rect x="40" y="124" width="132" height="52" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399"/>
  <rect x="48" y="130" width="34" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.5" stroke-width="0.8"/><text x="65" y="139" fill="#7a8399" font-size="7" font-family="monospace" text-anchor="middle">dp9</text>
  <text x="106" y="152" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Master</text>
  <text x="106" y="168" fill="#4f5d75" font-size="9" font-family="monospace" text-anchor="middle">Vision · .1</text>

  <rect x="208" y="124" width="104" height="52" rx="6" fill="#f5f5f5"/><rect x="208" y="124" width="104" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
  <text x="260" y="148" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Parser</text>
  <text x="260" y="164" fill="#4f5d75" font-size="9" font-family="monospace" text-anchor="middle">DNP3 / link CRC</text>

  <rect x="356" y="104" width="240" height="110" rx="6" fill="#f5f5f5"/><rect x="356" y="104" width="240" height="110" rx="6" fill="#c0552b" fill-opacity="0.06" stroke="#c0552b" stroke-width="1.2"/>
  <rect x="364" y="110" width="120" height="12" rx="2" fill="none" stroke="#c0552b" stroke-opacity="0.5" stroke-width="0.8"/><text x="424" y="119" fill="#c0552b" font-size="7" font-family="monospace" text-anchor="middle">12 INGRESS MAU STAGES</text>
  <text x="476" y="144" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">pclass dispatch</text>
  <text x="476" y="162" fill="#4f5d75" font-size="9" font-family="monospace" text-anchor="middle">RRC | BOR | bypass  (mut. excl.)</text>
  <text x="476" y="180" fill="#4f5d75" font-size="9" font-family="monospace" text-anchor="middle">1 meta.outcome · 1 ctr_outcome</text>
  <text x="476" y="200" fill="#7a8399" font-size="8" font-family="monospace" text-anchor="middle">one pipe · ≤12 stage fit</text>

  <rect x="656" y="124" width="148" height="52" rx="6" fill="#f5f5f5"/><rect x="656" y="124" width="148" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
  <text x="730" y="148" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">tbl_commit</text>
  <text x="730" y="164" fill="#4f5d75" font-size="9" font-family="monospace" text-anchor="middle">port · qid · drop · PRE</text>

  <rect x="852" y="124" width="128" height="52" rx="6" fill="#f5f5f5"/><rect x="852" y="124" width="128" height="52" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399"/>
  <rect x="860" y="130" width="40" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.5" stroke-width="0.8"/><text x="880" y="139" fill="#7a8399" font-size="7" font-family="monospace" text-anchor="middle">dp64</text>
  <text x="916" y="152" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">SEL-751</text>
  <text x="916" y="168" fill="#4f5d75" font-size="9" font-family="monospace" text-anchor="middle">relay egress .7</text>

  <!-- TRAFFIC MANAGER region -->
  <rect x="40" y="300" width="940" height="392" rx="8" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.20"/>
  <text x="56" y="326" fill="#7a8399" font-size="9" font-family="monospace" letter-spacing="0.14em">TRAFFIC MANAGER — egress queues + strict-priority schedulers (shaping OFF)</text>

  <!-- dp8 RRC domain -->
  <rect x="64" y="344" width="512" height="324" rx="6" fill="#f5f5f5"/><rect x="64" y="344" width="512" height="324" rx="6" fill="#2d3142" fill-opacity="0.04" stroke="#4f5d75"/>
  <rect x="76" y="352" width="252" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.5" stroke-width="0.8"/><text x="202" y="361" fill="#4f5d75" font-size="7" font-family="monospace" text-anchor="middle">dp8 · RRC LOOPBACK DOMAIN (own scheduler)</text>
  <text x="90" y="392" fill="#7a8399" font-size="8" font-family="monospace">HIGH</text>
  <path d="M100 400 V612" stroke="#7a8399" stroke-opacity="0.4" stroke-width="1" marker-end="url(#ard)"/>
  <text x="92" y="628" fill="#7a8399" font-size="8" font-family="monospace">LOW</text>
  <g font-family="monospace">
    <rect x="128" y="388" width="360" height="40" rx="4" fill="#ffffff" stroke="#2d3142"/><text x="150" y="412" fill="#c0552b" font-size="11" font-weight="600">qid7</text><text x="216" y="406" fill="#2d3142" font-size="11" font-weight="600">ACK_BLOCK</text><text x="216" y="421" fill="#7a8399" font-size="8">ACK blocker reservoir (pktgen-seeded)</text>
    <rect x="128" y="436" width="360" height="40" rx="4" fill="#ffffff" stroke="#2d3142"/><text x="150" y="460" fill="#2d3142" font-size="11" font-weight="600">qid6</text><text x="216" y="454" fill="#2d3142" font-size="11" font-weight="600">ACK_HOLD</text><text x="216" y="469" fill="#7a8399" font-size="8">held ACK — release at T0+A</text>
    <rect x="128" y="484" width="360" height="40" rx="4" fill="#ffffff" stroke="#2d3142"/><text x="150" y="508" fill="#2d3142" font-size="11" font-weight="600">qid5</text><text x="216" y="502" fill="#2d3142" font-size="11" font-weight="600">RESP_BLOCK</text><text x="216" y="517" fill="#7a8399" font-size="8">response blocker reservoir</text>
    <rect x="128" y="532" width="360" height="40" rx="4" fill="#ffffff" stroke="#2d3142"/><text x="150" y="556" fill="#2d3142" font-size="11" font-weight="600">qid4</text><text x="216" y="550" fill="#2d3142" font-size="11" font-weight="600">RESP_HOLD</text><text x="216" y="565" fill="#7a8399" font-size="8">held [28,21] echo — release at T0+R</text>
  </g>
  <text x="320" y="598" fill="#4f5d75" font-size="9" font-family="monospace" text-anchor="middle">RRC: carve at CRC boundaries → [28,21] · normalize CLRT</text>
  <path d="M488 456 H540 a8 8 0 0 0 8 -8 V158 a8 8 0 0 1 8 -8 H656" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#ar)"/>

  <!-- dp10 BOR domain -->
  <rect x="608" y="344" width="352" height="324" rx="6" fill="#f5f5f5"/><rect x="608" y="344" width="352" height="324" rx="6" fill="#2d3142" fill-opacity="0.04" stroke="#4f5d75"/>
  <rect x="620" y="352" width="256" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.5" stroke-width="0.8"/><text x="748" y="361" fill="#4f5d75" font-size="7" font-family="monospace" text-anchor="middle">dp10 · BOR LOOPBACK DOMAIN (own scheduler)</text>
  <text x="632" y="392" fill="#7a8399" font-size="8" font-family="monospace">HIGH</text>
  <path d="M640 400 V564" stroke="#7a8399" stroke-opacity="0.4" stroke-width="1" marker-end="url(#ard)"/>
  <text x="634" y="580" fill="#7a8399" font-size="8" font-family="monospace">LOW</text>
  <g font-family="monospace">
    <rect x="668" y="388" width="272" height="40" rx="4" fill="#ffffff" stroke="#2d3142"/><text x="690" y="412" fill="#c0552b" font-size="11" font-weight="600">qid3</text><text x="752" y="406" fill="#2d3142" font-size="11" font-weight="600">OP_BLOCK</text><text x="752" y="421" fill="#7a8399" font-size="8">OPERATE blocker — SELECT pre-seeds epoch</text>
    <rect x="668" y="436" width="272" height="40" rx="4" fill="#ffffff" stroke="#2d3142"/><text x="690" y="460" fill="#2d3142" font-size="11" font-weight="600">qid2</text><text x="752" y="454" fill="#2d3142" font-size="11" font-weight="600">OP_HOLD</text><text x="752" y="469" fill="#7a8399" font-size="8">held OPERATE — release once at T0+J</text>
  </g>
  <text x="784" y="510" fill="#4f5d75" font-size="9" font-family="monospace" text-anchor="middle">BOR: hold OPERATE, release once @ T0+J</text>
  <text x="784" y="526" fill="#7a8399" font-size="8.5" font-family="monospace" text-anchor="middle">ACK@T0+A, echo@T0+R invariant to J</text>
  <path d="M940 456 H960 V150 H976" stroke="#c0552b" stroke-width="1.2" fill="none"/>

  <!-- dp68 pktgen feeding *_BLOCK reservoirs -->
  <rect x="668" y="604" width="272" height="48" rx="6" fill="#f5f5f5"/><rect x="668" y="604" width="272" height="48" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-dasharray="4,3"/>
  <rect x="676" y="610" width="40" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.5" stroke-width="0.8"/><text x="696" y="619" fill="#7a8399" font-size="7" font-family="monospace" text-anchor="middle">dp68</text>
  <text x="808" y="628" fill="#2d3142" font-size="10" font-weight="600" text-anchor="middle">pktgen / recirc · clone-mirror</text>
  <text x="808" y="642" fill="#7a8399" font-size="8" font-family="monospace" text-anchor="middle">seeds *_BLOCK reservoirs · internal, NOT a host tap</text>
  <path d="M804 604 V584 a8 8 0 0 0 -4 -8 H752" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" fill="none" marker-end="url(#ard)"/>
  <path d="M668 628 H520 a8 8 0 0 1 -8 -8 V412 a8 8 0 0 1 8 -8 H500" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" fill="none" marker-end="url(#ard)"/>

  <!-- legend -->
  <line x1="40" y1="726" x2="980" y2="726" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
  <text x="40" y="744" fill="#4f5d75" font-size="8" font-family="monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="120" y1="741" x2="150" y2="741" stroke="#c0552b" stroke-width="1.4"/><text x="156" y="744" fill="#4f5d75" font-size="9" font-family="monospace">forward / release</text>
  <line x1="300" y1="741" x2="330" y2="741" stroke="#4f5d75" stroke-width="1"/><text x="336" y="744" fill="#4f5d75" font-size="9" font-family="monospace">recirc / strict-priority</text>
  <line x1="510" y1="741" x2="540" y2="741" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3"/><text x="546" y="744" fill="#4f5d75" font-size="9" font-family="monospace">held return / pktgen (internal)</text>
  <text x="800" y="744" fill="#7a8399" font-size="8.5" font-family="monospace">dp8/dp10 = internal loopbacks</text>
</svg>
