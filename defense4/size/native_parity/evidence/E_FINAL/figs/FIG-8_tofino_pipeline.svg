<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 600" role="img" aria-labelledby="fig8-title fig8-desc" font-family="Helvetica, Arial, sans-serif">
  <title id="fig8-title">Tofino-1 dataplane pipeline for the unified RRC+BOR DNP3 defense</title>
  <desc id="fig8-desc">One Tofino-1 pipe: master ingress on dp9 enters the parser and a 12-stage MAU with early packet-class dispatch splitting into mutually-exclusive RRC, BOR, and bypass paths to one tbl_commit terminal; two switch-internal loopback scheduling domains (dp8 RRC ladder qid7 to qid4, dp10 BOR ladder qid3 to qid2) recirculate held traffic, released OPERATE egresses to the SEL-751 on dp64, and dp68 is the internal pktgen and clone-mirror.</desc>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c0552b"/></marker>
    <marker id="ard" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- header -->
  <text x="40" y="44" fill="#7a8399" font-size="11" letter-spacing="0.16em" font-family="monospace">TOFINO-1 DATAPLANE · ONE PIPE · 12 INGRESS MAU STAGES</text>
  <text x="40" y="72" fill="#2d3142" font-size="24" font-family="Georgia, 'Times New Roman', serif">Unified RRC + BOR pipeline</text>

  <!-- ===================== connectors (drawn first) ===================== -->
  <!-- master -> parser -->
  <path d="M172 150 H208" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#ar)"/>
  <!-- parser -> MAU -->
  <path d="M312 150 H356" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#ar)"/>
  <!-- MAU -> commit (accent, main outcome) -->
  <path d="M596 150 H656" stroke="#c0552b" stroke-width="1.4" fill="none" marker-end="url(#arc)"/>
  <!-- commit -> relay egress dp64 -->
  <path d="M804 150 H852" stroke="#c0552b" stroke-width="1.4" fill="none" marker-end="url(#arc)"/>
  <!-- MAU down to dp8 RRC ladder (recirc out) -->
  <path d="M436 214 V300 a8 8 0 0 0 8 8 H452" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#ar)"/>
  <!-- dp8 ladder back up to MAU (recirc return, dashed) -->
  <path d="M452 336 H404 a8 8 0 0 1 -8 -8 V214" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" fill="none" marker-end="url(#ard)"/>
  <!-- MAU down to dp10 BOR ladder -->
  <path d="M516 214 V332 a8 8 0 0 0 8 8 H660" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#ar)"/>
  <!-- dp10 ladder back up (dashed) -->
  <path d="M660 372 H556 a8 8 0 0 1 -8 -8 V214" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" fill="none" marker-end="url(#ard)"/>
  <!-- dp68 pktgen -> ladders -->
  <path d="M232 380 H300 a8 8 0 0 1 8 8 V500" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" fill="none"/>
  <path d="M156 404 V520 a8 8 0 0 0 8 8 H452" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" fill="none" marker-end="url(#ard)"/>
  <path d="M156 404 V520 a8 8 0 0 0 8 8 H660" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" fill="none" marker-end="url(#ard)"/>

  <!-- connector labels (masked, gap above line) -->
  <rect x="356" y="122" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="382" y="131" fill="#7a8399" font-size="8" font-family="monospace" text-anchor="middle">INGRESS</text>
  <rect x="600" y="122" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="630" y="131" fill="#c0552b" font-size="8" font-family="monospace" text-anchor="middle">OUTCOME</text>
  <rect x="808" y="122" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="832" y="131" fill="#c0552b" font-size="8" font-family="monospace" text-anchor="middle">RELEASE</text>

  <!-- ===================== nodes ===================== -->
  <!-- dp9 master -->
  <rect x="40" y="124" width="132" height="52" rx="6" fill="#f5f5f5"/><rect x="40" y="124" width="132" height="52" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399"/>
  <rect x="48" y="130" width="34" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.5" stroke-width="0.8"/><text x="65" y="139" fill="#7a8399" font-size="7" font-family="monospace" text-anchor="middle">dp9</text>
  <text x="106" y="152" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Master</text>
  <text x="106" y="168" fill="#4f5d75" font-size="9" font-family="monospace" text-anchor="middle">Vision · 10.10.54.19</text>

  <!-- parser -->
  <rect x="208" y="124" width="104" height="52" rx="6" fill="#f5f5f5"/><rect x="208" y="124" width="104" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
  <text x="260" y="148" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Parser</text>
  <text x="260" y="164" fill="#4f5d75" font-size="9" font-family="monospace" text-anchor="middle">DNP3 / link CRC</text>

  <!-- 12-stage MAU + pclass (central focal) -->
  <rect x="356" y="104" width="240" height="110" rx="6" fill="#f5f5f5"/><rect x="356" y="104" width="240" height="110" rx="6" fill="#c0552b" fill-opacity="0.06" stroke="#c0552b" stroke-width="1.2"/>
  <rect x="364" y="110" width="120" height="12" rx="2" fill="none" stroke="#c0552b" stroke-opacity="0.5" stroke-width="0.8"/><text x="424" y="119" fill="#c0552b" font-size="7" font-family="monospace" text-anchor="middle">12 INGRESS MAU STAGES</text>
  <text x="476" y="144" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">pclass dispatch</text>
  <text x="476" y="162" fill="#4f5d75" font-size="9" font-family="monospace" text-anchor="middle">RRC | BOR | bypass  (mutually excl.)</text>
  <text x="476" y="180" fill="#4f5d75" font-size="9" font-family="monospace" text-anchor="middle">1 meta.outcome · 1 ctr_outcome</text>
  <text x="476" y="200" fill="#7a8399" font-size="8" font-family="monospace" text-anchor="middle">one pipe · ≤12 stage fit</text>

  <!-- tbl_commit -->
  <rect x="656" y="124" width="148" height="52" rx="6" fill="#f5f5f5"/><rect x="656" y="124" width="148" height="52" rx="6" fill="#ffffff" stroke="#2d3142"/>
  <text x="730" y="148" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">tbl_commit</text>
  <text x="730" y="164" fill="#4f5d75" font-size="9" font-family="monospace" text-anchor="middle">port · qid · drop · PRE</text>

  <!-- dp64 relay egress -->
  <rect x="852" y="124" width="96" height="52" rx="6" fill="#f5f5f5"/><rect x="852" y="124" width="96" height="52" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399"/>
  <rect x="860" y="130" width="40" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.5" stroke-width="0.8"/><text x="880" y="139" fill="#7a8399" font-size="7" font-family="monospace" text-anchor="middle">dp64</text>
  <text x="900" y="156" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">SEL-751</text>
  <text x="900" y="170" fill="#4f5d75" font-size="9" font-family="monospace" text-anchor="middle">relay .7</text>

  <!-- dp8 RRC loopback ladder -->
  <rect x="404" y="308" width="196" height="72" rx="6" fill="#f5f5f5"/><rect x="404" y="308" width="196" height="72" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75"/>
  <rect x="412" y="314" width="152" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.5" stroke-width="0.8"/><text x="488" y="323" fill="#4f5d75" font-size="7" font-family="monospace" text-anchor="middle">dp8 · RRC LOOPBACK DOMAIN</text>
  <text x="502" y="344" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle">strict ladder</text>
  <text x="502" y="362" fill="#4f5d75" font-size="9" font-family="monospace" text-anchor="middle">qid7 ACK_BLK &gt; qid6 ACK_HOLD</text>
  <text x="502" y="374" fill="#4f5d75" font-size="9" font-family="monospace" text-anchor="middle">&gt; qid5 RESP_BLK &gt; qid4 RESP_HOLD</text>

  <!-- dp10 BOR loopback ladder -->
  <rect x="612" y="340" width="188" height="72" rx="6" fill="#f5f5f5"/><rect x="612" y="340" width="188" height="72" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75"/>
  <rect x="620" y="346" width="152" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.5" stroke-width="0.8"/><text x="696" y="355" fill="#4f5d75" font-size="7" font-family="monospace" text-anchor="middle">dp10 · BOR LOOPBACK DOMAIN</text>
  <text x="706" y="378" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle">strict ladder</text>
  <text x="706" y="396" fill="#4f5d75" font-size="9" font-family="monospace" text-anchor="middle">qid3 OP_BLK &gt; qid2 OP_HOLD</text>

  <!-- dp68 pktgen -->
  <rect x="40" y="352" width="192" height="52" rx="6" fill="#f5f5f5"/><rect x="40" y="352" width="192" height="52" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-dasharray="4,3"/>
  <rect x="48" y="358" width="40" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.5" stroke-width="0.8"/><text x="68" y="367" fill="#7a8399" font-size="7" font-family="monospace" text-anchor="middle">dp68</text>
  <text x="136" y="378" fill="#2d3142" font-size="11" font-weight="600" text-anchor="middle">pktgen / recirc · clone-mirror</text>
  <text x="136" y="394" fill="#7a8399" font-size="8.5" font-family="monospace" text-anchor="middle">internal — NOT a host tap</text>

  <!-- ===================== legend ===================== -->
  <line x1="40" y1="548" x2="940" y2="548" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
  <text x="40" y="566" fill="#4f5d75" font-size="8" font-family="monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="120" y1="563" x2="150" y2="563" stroke="#c0552b" stroke-width="1.4"/><text x="156" y="566" fill="#4f5d75" font-size="9" font-family="monospace">forward / release path</text>
  <line x1="320" y1="563" x2="350" y2="563" stroke="#4f5d75" stroke-width="1"/><text x="356" y="566" fill="#4f5d75" font-size="9" font-family="monospace">recirculate to loopback</text>
  <line x1="540" y1="563" x2="570" y2="563" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4"/><text x="576" y="566" fill="#4f5d75" font-size="9" font-family="monospace">held return / pktgen (internal)</text>
  <text x="820" y="566" fill="#7a8399" font-size="8.5" font-family="monospace">dp8/dp10 = internal loopbacks</text>
</svg>
