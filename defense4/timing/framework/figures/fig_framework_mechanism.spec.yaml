meta:
  profile: academic-paper
  figureType: architecture
  source: edited
  theme: academic-color
  layout: horizontal
  canvas: 1000x968
  routing: orthogonal
  font:
    primary: Times New Roman
    cjk: Times New Roman,SimSun
    formula: Times New Roman
  print:
    target: ieee-double
    widthPt: 515.52
    minPt: 8
  title: Case 4 timing architecture and separate size evidence
  description: Proposed target timing domains with initial blocker seeds and loop
    returns through ingress, distinct from the executed BMv2 software padding/carving
    path; no complete target qualification.
  legend: Solid blue depicts external packet paths and queue returns; solid orange
    depicts generated internal packets. Dashed lines depict configuration or clone
    triggers. Explicit labels distinguish Read/control and proposed target/software.
  replication:
    colorMode: preserve-original
    background: '#ffffff'
    palette:
    - hex: '#1f4e9e'
      role: packet paths including ingress returns
      appliesTo: mixed
      confidence: high
    - hex: '#c25b00'
      role: internal tokens
      appliesTo: mixed
      confidence: high
    - hex: '#555555'
      role: neutral control
      appliesTo: mixed
      confidence: high
