meta:
  profile: academic-paper
  figureType: architecture
  source: edited
  theme: academic-color
  layout: horizontal
  canvas: 1000x792
  routing: orthogonal
  font:
    primary: Times New Roman
    cjk: Times New Roman,SimSun
    formula: Times New Roman
  print:
    target: ieee-double
    widthPt: 515.52
    minPt: 8
  title: Case 4 timing architecture and separate size evidence
  description: Explicit endpoint send/receive directions, three scheduling domains, ingress returns, clone-triggered
    packet generation and independent timeout pulse; component compilation is distinct from a complete
    joint implementation.
  legend: Solid blue depicts packet paths, including queue returns; dashed orange depicts internal seeding
    and control. Queue IDs, port IDs and labels carry meaning independently of color.
  replication:
    colorMode: preserve-original
    background: '#ffffff'
    palette:
    - hex: '#1f4e9e'
      role: packet paths including ingress returns
      appliesTo: mixed
      confidence: high
    - hex: '#c25b00'
      role: internal tokens
      appliesTo: mixed
      confidence: high
    - hex: '#555555'
      role: neutral control
      appliesTo: mixed
      confidence: high
