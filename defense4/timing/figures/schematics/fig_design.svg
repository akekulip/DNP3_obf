<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 246 135" width="3.417in" height="1.875in" role="img" aria-labelledby="des-title des-desc"><title id="des-title">Design overview</title><desc id="des-desc">Inside one programmable switch, ingress classifies every arrival, from the master or back from the relay, and arms its release deadlines. The read lane holds the acknowledgment and the response of a READ or SELECT, and the control lane holds an OPERATE, each behind a queue of generated blocker packets that a strict-priority scheduler drains first, which is what realizes the deadline. The on-chip packet generator keeps the blocker queues non-empty.</desc><rect width="246" height="135" fill="#ffffff"/><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="c2"><g transform="translate(0.5,0.5)"><rect x="31" y="4" width="204" height="124" rx="2.48" ry="2.48" fill="#f7f8fa" stroke="#c5ccd3" stroke-width="0.7" pointer-events="all"/></g></g><g data-cell-id="c3"><g><rect x="31" y="120" width="204" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#6B6B6B" font-family="'Times New Roman'" text-anchor="middle" font-size="8px"><text x="133" y="127.5">programmable switch</text></g></g></g><g data-cell-id="c4"><g transform="translate(0.5,0.5)"><path d="M 29 68 L 37.8 44 L 64.2 44 L 73 68 Z" fill="#e7ebef" stroke="#2f3e4e" stroke-width="0.7" stroke-miterlimit="10" transform="rotate(270,51,56)" pointer-events="all"/></g></g><g data-cell-id="c5"><g><rect x="33" y="82" width="36" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#6B6B6B" font-family="'Times New Roman'" text-anchor="middle" font-size="8px"><text x="51" y="89.5">classify</text></g></g></g><g data-cell-id="c6"><g transform="translate(0.5,0.5)"><path d="M 7 46 L 31.46 46" fill="none" stroke="#d55e00" stroke-width="1.2" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 36.66 46 L 31.46 48.6 L 31.46 43.4 Z" 