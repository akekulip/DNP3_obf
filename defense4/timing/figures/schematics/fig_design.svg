<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 176" width="3.5in" height="2.444in" role="img" aria-labelledby="des-title des-desc">
<title id="des-title">Design overview</title>
<desc id="des-desc">Inside one programmable switch, ingress classifies each DNP3 transaction and arms its release deadlines. The read lane holds the acknowledgment and the response of a READ or SELECT and releases them at t_A + D_A and t_A + D_A + D_R, relative to the relay acknowledgment. The control lane holds an OPERATE, forwards it to the relay at T0 + J, and releases its acknowledgment and echo at T0 + A and T0 + R, relative to the request. The on-chip packet generator fills the blocker reservoirs of both lanes; a strict-priority scheduler drains the blockers first, which realizes each deadline. Unmatched traffic is forwarded unchanged.</desc>
<defs>
  <marker id="dK" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#000000"/></marker>
  <marker id="dR" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#D72927"/></marker>
  <marker id="dG" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#2BA02B"/></marker>
  <marker id="dO" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#FF800E"/></marker>
</defs>
<rect width="252" height="176" fill="#ffffff"/>
<g font-family="Times New Roman, Times, serif" fill="#000000">

<!-- switch outline -->
<rect x="30" y="8" width="192" height="146" rx="3" fill="#2177B5" fill-opacity="0.05" stroke="#2177B5" stroke-opacity="0.6" stroke-width="0.7" stroke-dasharray="3,2"/>
<text x="35" y="17" font-size="6.5" font-style="italic" fill="#2177B5">programmable switch (one P4 pipeline)</text>

<!-- from master into ingress -->
<line x1="4" y1="46" x2="39" y2="46" stroke="#D72927" stroke-width="1.0" marker-end="url(#dR)"/>
<text x="4" y="41" font-size="6.5" fill="#D72927">from master</text>

<!-- ingress box (tall, spans both lanes) -->
<rect x="40" y="26" width="60" height="110" rx="2" fill="#ffffff" stroke="#2177B5" stroke-width="1.1"/>
<text x="70" y="38" font-size="7.5" text-anchor="middle" font-weight="bold">Ingress</text>
<text x="70" y="50" font-size="6.5" text-anchor="middle">classify by</text>
<text x="70" y="58" font-size="6.5" text-anchor="middle">function code</text>
<text x="70" y="70" font-size="6.5" text-anchor="middle">match the</text>
<text x="70" y="78" font-size="6.5" text-anchor="middle">transaction</text>
<text x="70" y="90" font-size="6.5" text-anchor="middle">arm release</text>
<text x="70" y="98" font-size="6.5" text-anchor="middle">deadlines</text>
<text x="70" y="112" font-size="6.5" text-anchor="middle">forward the</text>
<text x="70" y="120" font-size="6.5" text-anchor="middle">request</text>

<!-- ingress -> read lane, ingress -> control lane -->
<line x1="100" y1="46" x2="117" y2="46" stroke="#000000" stroke-width="0.9" marker-end="url(#dK)"/>
<line x1="100" y1="110" x2="117" y2="110" stroke="#000000" stroke-width="0.9" marker-end="url(#dK)"/>

<!-- read lane -->
<rect x="118" y="26" width="90" height="40" rx="2" fill="#2BA02B" fill-opacity="0.08" stroke="#2BA02B" stroke-width="1.0"/>
<text x="163" y="36" font-size="7.5" text-anchor="middle" font-weight="bold" fill="#2BA02B">read lane (READ, SELECT)</text>
<text x="163" y="46" font-size="6.5" text-anchor="middle">hold ACK, release at t<tspan font-size="5" baseline-shift="sub">A</tspan> + D<tspan font-size="5" baseline-shift="sub">A</tspan></text>
<text x="163" y="55" font-size="6.5" text-anchor="middle">hold response, release + D<tspan font-size="5" baseline-shift="sub">R</tspan></text>
<g fill="#FF800E" fill-opacity="0.85">
<rect x="123" y="58" width="3.5" height="5"/><rect x="128" y="58" width="3.5" height="5"/><rect x="133" y="58" width="3.5" height="5"/><rect x="138" y="58" width="3.5" height="5"/>
</g>
<text x="144" y="62.5" font-size="5.5" fill="#B35A00">blockers, strict priority</text>

<!-- packet generator between the lanes -->
<rect x="118" y="76" width="90" height="14" rx="2" fill="#FF800E" fill-opacity="0.10" stroke="#FF800E" stroke-width="0.9"/>
<text x="163" y="85.5" font-size="7" text-anchor="middle" fill="#B35A00">on-chip packet generator</text>
<line x1="163" y1="76" x2="163" y2="67" stroke="#FF800E" stroke-width="0.8" stroke-dasharray="2,1.5" marker-end="url(#dO)"/>
<line x1="163" y1="90" x2="163" y2="99" stroke="#FF800E" stroke-width="0.8" stroke-dasharray="2,1.5" marker-end="url(#dO)"/>

<!-- control lane -->
<rect x="118" y="100" width="90" height="40" rx="2" fill="#FF800E" fill-opacity="0.08" stroke="#FF800E" stroke-width="1.0"/>
<text x="163" y="110" font-size="7.5" text-anchor="middle" font-weight="bold" fill="#B35A00">control lane (OPERATE)</text>
<text x="163" y="120" font-size="6.5" text-anchor="middle">hold OPERATE, to relay at T<tspan font-size="5" baseline-shift="sub">0</tspan> + J</text>
<text x="163" y="129" font-size="6.5" text-anchor="middle">ACK at T<tspan font-size="5" baseline-shift="sub">0</tspan> + A, echo at T<tspan font-size="5" baseline-shift="sub">0</tspan> + R</text>
<g fill="#FF800E" fill-opacity="0.85">
<rect x="123" y="132" width="3.5" height="5"/><rect x="128" y="132" width="3.5" height="5"/><rect x="133" y="132" width="3.5" height="5"/><rect x="138" y="132" width="3.5" height="5"/>
</g>
<text x="144" y="136.5" font-size="5.5" fill="#B35A00">blockers, strict priority</text>

<!-- outputs to master -->
<line x1="208" y1="46" x2="235" y2="46" stroke="#D72927" stroke-width="1.0" marker-end="url(#dR)"/>
<text x="248" y="41" font-size="6.5" text-anchor="end" fill="#D72927">to master</text>
<line x1="208" y1="120" x2="235" y2="120" stroke="#D72927" stroke-width="1.0" marker-end="url(#dR)"/>
<text x="248" y="115" font-size="6.5" text-anchor="end" fill="#D72927">to master</text>
<!-- output to relay from the control lane -->
<line x1="208" y1="134" x2="235" y2="134" stroke="#2BA02B" stroke-width="0.9" stroke-dasharray="3,2" marker-end="url(#dG)"/>
<text x="248" y="146" font-size="6.5" text-anchor="end" fill="#2BA02B">to relay at T<tspan font-size="5" baseline-shift="sub">0</tspan> + J</text>

<!-- unmatched: forward unchanged (below everything, no crossing) -->
<path d="M 70 136 L 70 160 L 235 160" fill="none" stroke="#000000" stroke-width="0.8" stroke-dasharray="3,2" marker-end="url(#dK)"/>
<rect x="100" y="155" width="98" height="10" fill="#ffffff"/>
<text x="149" y="162.5" font-size="6.5" text-anchor="middle">unmatched: forward unchanged</text>
<text x="248" y="158" font-size="6.5" text-anchor="end">forward</text>

<!-- legend line -->
<text x="4" y="173" font-size="6"><tspan fill="#D72927">red</tspan>: master-facing (observed)   <tspan fill="#2BA02B">green</tspan>: relay side   <tspan fill="#B35A00">orange</tspan>: blockers from the generator</text>
</g>
</svg>
