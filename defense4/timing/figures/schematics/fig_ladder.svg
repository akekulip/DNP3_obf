<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 266" width="3.5in" height="3.694in" role="img" aria-labelledby="lad-title lad-desc">
<title id="lad-title">DNP3 transaction ladder</title>
<desc id="lad-desc">A READ poll and a select-before-operate control between master and outstation as seen on the master-facing link. Requests in blue, transport-layer acknowledgments in grey, application responses in green. The interval c (CLRT) is the acknowledgment-to-response interval of the READ; O is the master-visible OPERATE response-to-ACK interval.</desc>
<defs>
  <marker id="hB" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6 z" fill="#2177B5"/></marker>
  <marker id="hG" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6 z" fill="#2BA02B"/></marker>
  <marker id="hK" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6 z" fill="#666666"/></marker>
  <marker id="hR" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6 z" fill="#D72927"/></marker>
</defs>
<rect width="252" height="266" fill="#ffffff"/>
<g font-family="Times New Roman, Times, serif" font-size="8" fill="#000000">

<!-- ================= (a) READ ================= -->
<text x="4" y="12" font-style="italic">(a) READ poll</text>
<rect x="44" y="18" width="50" height="16" rx="2" fill="#E3EEF7" stroke="#2177B5" stroke-width="0.8"/>
<text x="69" y="29.5" text-anchor="middle">Master</text>
<rect x="170" y="18" width="58" height="16" rx="2" fill="#E6F3E6" stroke="#2BA02B" stroke-width="0.8"/>
<text x="199" y="29.5" text-anchor="middle">Outstation</text>
<line x1="69" y1="34" x2="69" y2="104" stroke="#000000" stroke-width="0.5" stroke-dasharray="2,2"/>
<line x1="199" y1="34" x2="199" y2="104" stroke="#000000" stroke-width="0.5" stroke-dasharray="2,2"/>

<rect x="70" y="68" width="128" height="26" fill="#D72927" fill-opacity="0.07"/>

<line x1="70" y1="50" x2="197" y2="50" stroke="#2177B5" stroke-width="0.9" marker-end="url(#hB)"/>
<text x="134" y="46.5" text-anchor="middle" fill="#2177B5">READ request (function 1)</text>
<line x1="197" y1="68" x2="71" y2="68" stroke="#666666" stroke-width="0.9" marker-end="url(#hK)"/>
<text x="134" y="64.5" text-anchor="middle" fill="#444444">TCP acknowledgment</text>
<line x1="197" y1="94" x2="71" y2="94" stroke="#2BA02B" stroke-width="0.9" marker-end="url(#hG)"/>
<text x="134" y="90.5" text-anchor="middle" fill="#2BA02B">application response (function 0x81)</text>

<line x1="36" y1="68" x2="36" y2="94" stroke="#D72927" stroke-width="0.9" marker-start="url(#hR)" marker-end="url(#hR)"/>
<line x1="36" y1="68" x2="66" y2="68" stroke="#D72927" stroke-width="0.4" stroke-opacity="0.6"/>
<line x1="36" y1="94" x2="66" y2="94" stroke="#D72927" stroke-width="0.4" stroke-opacity="0.6"/>
<text x="31" y="84" text-anchor="end" font-style="italic" fill="#D72927">c</text>

<!-- ================= (b) SBO ================= -->
<text x="4" y="124" font-style="italic">(b) Select-before-operate control</text>
<rect x="44" y="130" width="50" height="16" rx="2" fill="#E3EEF7" stroke="#2177B5" stroke-width="0.8"/>
<text x="69" y="141.5" text-anchor="middle">Master</text>
<rect x="170" y="130" width="58" height="16" rx="2" fill="#E6F3E6" stroke="#2BA02B" stroke-width="0.8"/>
<text x="199" y="141.5" text-anchor="middle">Outstation</text>
<line x1="69" y1="146" x2="69" y2="238" stroke="#000000" stroke-width="0.5" stroke-dasharray="2,2"/>
<line x1="199" y1="146" x2="199" y2="238" stroke="#000000" stroke-width="0.5" stroke-dasharray="2,2"/>

<rect x="70" y="214" width="128" height="18" fill="#D72927" fill-opacity="0.07"/>

<line x1="70" y1="162" x2="197" y2="162" stroke="#2177B5" stroke-width="0.9" marker-end="url(#hB)"/>
<text x="134" y="158.5" text-anchor="middle" fill="#2177B5">SELECT (function 3)</text>
<line x1="197" y1="176" x2="71" y2="176" stroke="#666666" stroke-width="0.9" marker-end="url(#hK)"/>
<text x="134" y="172.5" text-anchor="middle" fill="#444444">TCP acknowledgment</text>
<line x1="197" y1="190" x2="71" y2="190" stroke="#2BA02B" stroke-width="0.9" marker-end="url(#hG)"/>
<text x="134" y="186.5" text-anchor="middle" fill="#2BA02B">SELECT response</text>
<line x1="70" y1="204" x2="197" y2="204" stroke="#2177B5" stroke-width="0.9" marker-end="url(#hB)"/>
<text x="134" y="200.5" text-anchor="middle" fill="#2177B5">OPERATE (function 4)</text>
<line x1="197" y1="214" x2="71" y2="214" stroke="#666666" stroke-width="0.9" marker-end="url(#hK)"/>
<text x="134" y="210.5" text-anchor="middle" fill="#444444">TCP acknowledgment</text>
<line x1="197" y1="232" x2="71" y2="232" stroke="#2BA02B" stroke-width="0.9" marker-end="url(#hG)"/>
<text x="134" y="228.5" text-anchor="middle" fill="#2BA02B">OPERATE response</text>

<line x1="36" y1="214" x2="36" y2="232" stroke="#D72927" stroke-width="0.9" marker-start="url(#hR)" marker-end="url(#hR)"/>
<line x1="36" y1="214" x2="66" y2="214" stroke="#D72927" stroke-width="0.4" stroke-opacity="0.6"/>
<line x1="36" y1="232" x2="66" y2="232" stroke="#D72927" stroke-width="0.4" stroke-opacity="0.6"/>
<text x="31" y="226" text-anchor="end" font-style="italic" fill="#D72927">O</text>

<line x1="4" y1="244" x2="248" y2="244" stroke="#000000" stroke-opacity="0.25" stroke-width="0.5"/>
<text x="4" y="253"><tspan fill="#D72927" font-style="italic">c</tspan>: acknowledgment-to-response interval of the READ (CLRT).</text>
<text x="4" y="262"><tspan fill="#D72927" font-style="italic">O</tspan>: master-visible OPERATE response-to-ACK interval.</text>
</g>
</svg>
