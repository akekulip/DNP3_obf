<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 236" width="3.5in" height="3.278in" role="img" aria-labelledby="lad-title lad-desc">
<title id="lad-title">DNP3 transaction ladder</title>
<desc id="lad-desc">A READ poll and a select-before-operate control between master and outstation as seen on the master-facing link. Requests in blue, transport-layer acknowledgments in grey, application responses in green. The interval c (CLRT) is the acknowledgment-to-response interval of the READ; O is the acknowledgment-to-echo interval of the OPERATE.</desc>
<defs>
  <marker id="hB" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6 z" fill="#2177B5"/></marker>
  <marker id="hG" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6 z" fill="#2BA02B"/></marker>
  <marker id="hK" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6 z" fill="#666666"/></marker>
  <marker id="hR" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6 z" fill="#D72927"/></marker>
</defs>
<rect width="252" height="236" fill="#ffffff"/>
<g font-family="Times New Roman, Times, serif" fill="#000000">

<!-- ================= (a) READ ================= -->
<text x="6" y="12" font-size="8" font-style="italic">(a) READ poll</text>
<rect x="46" y="18" width="46" height="14" rx="2" fill="#E3EEF7" stroke="#2177B5" stroke-width="0.8"/>
<text x="69" y="28" font-size="8" text-anchor="middle">Master</text>
<rect x="172" y="18" width="52" height="14" rx="2" fill="#E6F3E6" stroke="#2BA02B" stroke-width="0.8"/>
<text x="198" y="28" font-size="8" text-anchor="middle">Outstation</text>
<line x1="69" y1="32" x2="69" y2="98" stroke="#000000" stroke-width="0.5" stroke-dasharray="2,2"/>
<line x1="198" y1="32" x2="198" y2="98" stroke="#000000" stroke-width="0.5" stroke-dasharray="2,2"/>

<!-- interval band c -->
<rect x="70" y="60" width="127" height="26" fill="#D72927" fill-opacity="0.07"/>

<line x1="70" y1="46" x2="196" y2="46" stroke="#2177B5" stroke-width="0.9" marker-end="url(#hB)"/>
<text x="133" y="43" font-size="7" text-anchor="middle" fill="#2177B5">READ request (function 1)</text>
<line x1="196" y1="60" x2="71" y2="60" stroke="#666666" stroke-width="0.9" marker-end="url(#hK)"/>
<text x="133" y="57" font-size="7" text-anchor="middle" fill="#444444">TCP acknowledgment</text>
<line x1="196" y1="86" x2="71" y2="86" stroke="#2BA02B" stroke-width="0.9" marker-end="url(#hG)"/>
<text x="133" y="83" font-size="7" text-anchor="middle" fill="#2BA02B">application response (function 0x81)</text>

<line x1="38" y1="60" x2="38" y2="86" stroke="#D72927" stroke-width="0.9" marker-start="url(#hR)" marker-end="url(#hR)"/>
<line x1="38" y1="60" x2="66" y2="60" stroke="#D72927" stroke-width="0.4" stroke-opacity="0.6"/>
<line x1="38" y1="86" x2="66" y2="86" stroke="#D72927" stroke-width="0.4" stroke-opacity="0.6"/>
<text x="34" y="76" font-size="8" text-anchor="end" font-style="italic" fill="#D72927">c</text>

<!-- ================= (b) SBO ================= -->
<text x="6" y="118" font-size="8" font-style="italic">(b) Select-before-operate control</text>
<rect x="46" y="124" width="46" height="14" rx="2" fill="#E3EEF7" stroke="#2177B5" stroke-width="0.8"/>
<text x="69" y="134" font-size="8" text-anchor="middle">Master</text>
<rect x="172" y="124" width="52" height="14" rx="2" fill="#E6F3E6" stroke="#2BA02B" stroke-width="0.8"/>
<text x="198" y="134" font-size="8" text-anchor="middle">Outstation</text>
<line x1="69" y1="138" x2="69" y2="212" stroke="#000000" stroke-width="0.5" stroke-dasharray="2,2"/>
<line x1="198" y1="138" x2="198" y2="212" stroke="#000000" stroke-width="0.5" stroke-dasharray="2,2"/>

<!-- interval band O -->
<rect x="70" y="194" width="127" height="14" fill="#D72927" fill-opacity="0.07"/>

<line x1="70" y1="150" x2="196" y2="150" stroke="#2177B5" stroke-width="0.9" marker-end="url(#hB)"/>
<text x="133" y="147" font-size="7" text-anchor="middle" fill="#2177B5">SELECT (function 3)</text>
<line x1="196" y1="161" x2="71" y2="161" stroke="#666666" stroke-width="0.9" marker-end="url(#hK)"/>
<text x="133" y="158" font-size="7" text-anchor="middle" fill="#444444">TCP acknowledgment</text>
<line x1="196" y1="172" x2="71" y2="172" stroke="#2BA02B" stroke-width="0.9" marker-end="url(#hG)"/>
<text x="133" y="169" font-size="7" text-anchor="middle" fill="#2BA02B">SELECT response (echo)</text>
<line x1="70" y1="184" x2="196" y2="184" stroke="#2177B5" stroke-width="0.9" marker-end="url(#hB)"/>
<text x="133" y="181" font-size="7" text-anchor="middle" fill="#2177B5">OPERATE (function 4)</text>
<line x1="196" y1="194" x2="71" y2="194" stroke="#666666" stroke-width="0.9" marker-end="url(#hK)"/>
<text x="133" y="191" font-size="7" text-anchor="middle" fill="#444444">TCP acknowledgment</text>
<line x1="196" y1="208" x2="71" y2="208" stroke="#2BA02B" stroke-width="0.9" marker-end="url(#hG)"/>
<text x="133" y="205" font-size="7" text-anchor="middle" fill="#2BA02B">OPERATE response (echo)</text>

<line x1="38" y1="194" x2="38" y2="208" stroke="#D72927" stroke-width="0.9" marker-start="url(#hR)" marker-end="url(#hR)"/>
<line x1="38" y1="194" x2="66" y2="194" stroke="#D72927" stroke-width="0.4" stroke-opacity="0.6"/>
<line x1="38" y1="208" x2="66" y2="208" stroke="#D72927" stroke-width="0.4" stroke-opacity="0.6"/>
<text x="34" y="204" font-size="8" text-anchor="end" font-style="italic" fill="#D72927">O</text>

<line x1="4" y1="218" x2="248" y2="218" stroke="#000000" stroke-opacity="0.25" stroke-width="0.5"/>
<text x="4" y="226" font-size="6.5"><tspan fill="#D72927" font-style="italic">c</tspan>: acknowledgment-to-response interval of the READ (CLRT).</text>
<text x="4" y="233" font-size="6.5"><tspan fill="#D72927" font-style="italic">O</tspan>: acknowledgment-to-echo interval of the OPERATE (operation time).</text>
</g>
</svg>
