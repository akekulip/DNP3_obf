<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 249 145" width="3.458in" height="2.014in" role="img" aria-labelledby="lad-title lad-desc"><title id="lad-title">DNP3 transaction ladder</title><desc id="lad-desc">Two DNP3 transactions between a SCADA master and the outstation, time running downwards. Requests are blue, transport acknowledgments grey and application responses green, with DNP3 function codes in grey beside the outstation. A bar on the outstation's lifeline marks the interval in which the device produces the answer. On the master side, c is the READ's cross-layer response time and O the master-visible OPERATE response-to-acknowledgment interval, both measured between the acknowledgment and the response arriving at the master.</desc><rect width="249" height="145" fill="#ffffff"/><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="c2"><g><rect x="20" y="2" width="100" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#6B6B6B" font-family="'Times New Roman'" font-style="italic" text-anchor="middle" font-size="8px"><text x="70" y="9.5">(a) READ poll</text></g></g></g><g data-cell-id="c3"><g><rect x="13" y="13" width="46" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2A36" font-family="'Times New Roman'" text-anchor="middle" font-size="8px"><text x="36" y="20.5">Master</text></g></g></g><g data-cell-id="c4"><g><rect x="81" y="13" width="46" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2A36" font-family="'Times New Roman'" text-anchor="middle" font-size="8px"><text x="104" y="20.5">Outstation</text></g></g></g><g data-cell-id="c5"><g transform="translate(0.5,0.5)"><path d="M 36 26 L 36 138" fill="none" stroke="#9aa4ae" stroke-width="0.6" stroke-miterlimit="10" stroke-dasharray="1.2 1.2" pointer-events="stroke"/></g></g><g data-cell-id="c6"><g transform="translate(0.5,0.5)"><path d="M 104 26 L 104 138" fill="none" stroke="#9aa4ae" stroke-width="0.6" stroke-miterlimit="10" stroke-dasharray="1.2 1.2" pointer-events="stroke"/></g></g><g data-cell-id="c7"><g><rect x="136" y="2" width="100" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#6B6B6B" font-family="'Times New Roman'" font-style="italic" text-anchor="middle" font-size="8px"><text x="186" y="9.5">(b) Select-before-operate</text></g></g></g><g data-cell-id="c8"><g><rect x="129" y="13" width="46" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2A36" font-family="'Times New Roman'" text-anchor="middle" font-size="8px"><text x="152" y="20.5">Master</text></g></g></g><g data-cell-id="c9"><g><rect x="197" y="13" width="46" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2A36" font-family="'Times New Roman'" text-anchor="middle" font-size="8px"><text x="220" y="20.5">Outstation</text></g></g></g><g data-cell-id="c10"><g transform="translate(0.5,0.5)"><path d="M 152 26 L 152 138" fill="none" stroke="#9aa4ae" stroke-width="0.6" stroke-miterlimit="10" stroke-dasharray="1.2 1.2" pointer-events="stroke"/></g></g><g data-cell-id="c11"><g transform="translate(0.5,0.5)"><path d="M 220 26 L 220 138" fill="none" stroke="#9aa4ae" stroke-width="0.6" stroke-miterlimit="10" stroke-dasharray="1.2 1.2" pointer-events="stroke"/></g></g><g data-cell-id="c12"><g transform="translate(0.5,0.5)"><path d="M 37.5 38 L 96.51 42.54" fill="none" stroke="#0072b2" stroke-width="0.95" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 101.44 42.92 L 96.32 45.01 L 96.7 40.07 Z" fill="#0072b2" stroke="#0072b2" stroke-width="0.95" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c13"><g><rect x="37" y="28.5" width="66" height="9" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1F2A36" font-family="'Times New Roman'" text-anchor="middle" font-size="8px"><text x="70" y="36">READ</text></g></g></g><g data-cell-id="c14"><g transfo